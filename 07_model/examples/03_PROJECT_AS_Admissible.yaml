  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
    reference_object_boundary: Only composite.authorization-sequence.alpha from smoke record 01 and synthetic access-evaluation scene gamma.
    operation_occurrence_boundary: Only PROJECT_AS occurrence project-as.occurrence.03.
    frame:
      value: synthetic access-evaluation frame
      control_source: 07_model/examples/03_PROJECT_AS_Admissible.yaml#/target/frame
      inventory_status: extension
