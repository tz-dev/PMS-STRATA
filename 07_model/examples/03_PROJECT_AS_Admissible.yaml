    target scene uses source-dependent features as a bounded contextual function, so the operation is PROJECT_AS rather than renaming, 
    analogy, COMPOSE, or DECOMPOSE.
  expected_praxeological_difference: The projection distinguishes the sequence merely existing as an origin-typed composite from the same 
    sequence performing a source-sensitive binding-function within scene gamma.
  selection_rule: Use exactly composite.authorization-sequence.alpha and scene gamma; preserve the origin type sequence, the 
    request-before-approval relation, and the t2 validity boundary; exclude all other contexts and functions.
  transformation_context: Synthetic formal-model smoke test of positive PROJECT_AS routing.
  details:
    target_context: Synthetic access-evaluation scene gamma during transition-eligibility check at t2.
    constitutive_source_trace:
      - trace_id: trace.sequence.identity.alpha
        source_feature: Independently reconstructed composite.authorization-sequence.alpha with origin type sequence.
        affected_claim_component: Source reference and origin-type preservation.
        trace_role: load_bearing
        result_dependency: Without the independently identified source sequence, the projection would collapse into a target label with no 
          source object.
        expected_result_change: Removing or replacing the source sequence defeats the current projection claim.
        temporal_or_relational_dependency: The sequence must remain the same request-before-approval composite established in smoke record 
          01.
        claim_limitation: Supports source identity and origin type, not target-scene validity by itself.
        source_pointer: 07_model/examples/01_COMPOSE_Admissible.yaml#/target/reference_object
      - trace_id: trace.sequence.order.alpha
        source_feature: The request-before-approval order is constitutive to the source sequence.
        affected_claim_component: Functional continuity of the projected binding-function.
        trace_role: load_bearing
        result_dependency: The target-scene rule recognizes only the declared ordered sequence, not either isolated event or a reversed 
          pair.
        expected_result_change: Reversing the order or removing either event withdraws the binding-function in scene gamma.
        temporal_or_relational_dependency: Request precedes approval within the retained source composite.
        claim_limitation: Counterfactual sensitivity establishes source dependence, not causality or external authorization.
        source_pointer: 07_model/examples/01_COMPOSE_Admissible.yaml#/operation/details/constitutive_relations/0
      - trace_id: trace.target-rule.gamma
