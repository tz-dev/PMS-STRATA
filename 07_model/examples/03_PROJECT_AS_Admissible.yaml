claim:
  claim_id: claim.project-as.admissible.03
  statement: Within synthetic access-evaluation scene gamma, the origin-typed authorization sequence alpha performs a bounded 
    binding-function for the scene's transition-eligibility check while remaining a sequence rather than becoming a new type or PMS 
    primitive.
  claim_type:
    value: contextual function claim
