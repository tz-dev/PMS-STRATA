      extension_rationale: Local target granularity for one bounded evaluation episode.
    relative_level:
      value: contextual target-function level relative to the origin-typed sequence
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Local wording instantiates the controlled source-target relative-level relation.
    temporal_scope: Synthetic evaluation interval t2 only.
    source_scope: Exactly the sequence formed in smoke record 01 plus the declared synthetic target-scene rule for gamma.
    context_scope: Only target scene gamma and its declared transition-eligibility check.
    generalization_boundary: No transfer to another scene, controller, institution, process, or real access system.
    excluded_reach:
      - No replacement of the origin type sequence by the target function.
      - No claim that the function is a new PMS primitive or a global property of the source object.
      - No claim that the sequence causes a physical transition, proves authorization legitimacy, or grants access.
      - No person, organization, legal status, security posture, or real system is evaluated.
  validity_scope: Valid only for the declared synthetic target scene gamma during the single evaluation interval t2.
  claim_ceiling:
    asserted_relation: The independently reconstructed source sequence is used by the declared target-scene rule as one bounded binding 
      input to a transition-eligibility check.
    reach: The source sequence, target scene gamma, the declared eligibility-check relation, and the t2 evaluation interval.
    precision: Source identity, origin type, request-before-approval relation, target context, and bounded function only.
    generality: Single synthetic fixture and one target scene.
    functional_scope: Binding-function within target scene gamma only; no global function, origin-type identity, causal mechanism, or 
      authorization authority.
    dependence_strength: The target function depends on the same source sequence, its order, and the declared scene rule.
    inferential_distance: One explicit PROJECT_AS step from an independently typed source composite to a bounded contextual function.
    limiting_sources:
      - source.record.compose.01
      - source.fixture.access-scene.gamma
    rationale: The sources support a context-bound functional projection but do not support transfer, type replacement, causal efficacy, 
      legitimacy, or real-world authorization.
  authority_boundary: The record authorizes only formal routing of this synthetic contextual-function claim; it grants no empirical truth, 
    security decision, access permission, or application authority.
