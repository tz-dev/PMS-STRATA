    excluded_reach:
    - No causal, technical-safety, organizational-quality, or authorization-validity conclusion.
    - No operator-type decomposition and no new PMS primitive.
    - No automatic admissibility of the proposed weaker formulation.
    - No person, institution, or real technical system is evaluated.
  validity_scope: Valid only as a synthetic demonstration that a stronger DECOMPOSE claim can require explicit reduction and
    retesting.
  claim_ceiling:
    asserted_relation: Three finer stages are asserted not merely to occur in order but to form one fully coordinated uninterrupted
