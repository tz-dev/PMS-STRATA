claim:
  claim_id: claim.project-as.label-substitution.04
  statement: Within synthetic label-registry scene delta, authorization sequence alpha performs a binding-function because
    the scene assigns that label to the sequence; the declared PROJECT_AS claim is tested and rejected because the label does
    not depend on the source sequence's constitutive identity, order, or relations.
  claim_type:
    value: contextual function claim
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: The local label identifies the attempted PROJECT_AS target-function claim without adding a canonical
      claim type.
  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
    reference_object_boundary: Only composite.authorization-sequence.alpha from smoke record 01 and synthetic label-registry
      scene delta.
    operation_occurrence_boundary: Only PROJECT_AS occurrence project-as.occurrence.04.
    frame:
      value: synthetic label-registry frame
      control_source: 07_model/examples/04_PROJECT_AS_Label_Substitution.yaml#/target/frame
      inventory_status: extension
      extension_rationale: Fixture-specific target frame used only to test label substitution.
    granularity:
      value: single label-assignment granularity
      control_source: 07_model/examples/04_PROJECT_AS_Label_Substitution.yaml#/target/granularity
      inventory_status: extension
      extension_rationale: Local target granularity for one nominal assignment episode.
    relative_level:
      value: attempted contextual target-function level relative to the origin-typed sequence
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Local wording instantiates the controlled source-target relation while preserving the failed status.
    temporal_scope: Synthetic label-assignment interval t3 only.
    source_scope: Exactly the sequence formed in smoke record 01 plus the declared synthetic label rule for scene delta.
    context_scope: Only target scene delta and its nominal label registry.
    generalization_boundary: No functional projection, analogy, transfer, or real registry behavior is retained beyond this
      fixture.
    excluded_reach:
    - No replacement of the origin type sequence by the target label.
    - No claim that the assigned label establishes a target function, mechanism, capability, role, or PMS primitive.
    - No claim that nominal boundedness compensates for absent functional continuity or counterfactual sensitivity.
    - No person, organization, legal status, security posture, or real system is evaluated.
  validity_scope: The failed operation assessment is valid only for the declared synthetic label rule in scene delta at t3.
  claim_ceiling:
    asserted_relation: The target scene assigns the string binding-function to the independently reconstructed source sequence.
    reach: The source sequence, scene delta, the nominal assignment rule, and the t3 interval.
    precision: Source identity, origin type, target label, and absence of source-dependent functional criteria.
    generality: Single synthetic fixture and one target label registry.
    functional_scope: No contextual function is retained; only the fact of label assignment and the failed PROJECT_AS claim
      are recorded.
    dependence_strength: The assigned label does not depend on the source sequence's constitutive order or relations.
    inferential_distance: One attempted PROJECT_AS step that fails because nominal assignment is substituted for functional
      projection.
    limiting_sources:
    - source.record.compose.01
    - source.fixture.label-scene.delta
    rationale: The sources support source identity and a nominal target label, but not a source-sensitive contextual target
      function.
  authority_boundary: The record authorizes only formal rejection of this synthetic PROJECT_AS claim; it grants no empirical
    truth, role assignment, access decision, or application authority.
