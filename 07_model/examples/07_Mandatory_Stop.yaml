claim:
  claim_id: claim.decompose.mandatory-stop.07
  statement: Further decomposition of the synthetic containment-closure occurrence must stop before candidate internal fragments are 
    asserted because available sources preserve only the occurrence boundary and its closure function; continuation would replace the 
    reference object with unsupported fragments and detach the retained function from source-supported relations.
  claim_type:
    value: mandatory stop claim
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: The local label identifies a stop determination for this synthetic transformation occurrence without adding a 
      canonical claim type.
  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
    reference_object_boundary: Only synthetic containment-closure occurrence eta and the contemplated opening into three unsupported 
      internal action fragments.
    operation_occurrence_boundary: Only DECOMPOSE occurrence decompose.occurrence.07.
    frame: &id001
      value: synthetic containment-closure occurrence frame
      control_source: 07_model/examples/07_Mandatory_Stop.yaml#/claim/claim_scope/frame
      inventory_status: extension
      extension_rationale: Fixture-specific frame used only to test a continuity-triggered mandatory stop.
    granularity:
      value: verified occurrence to unsupported internal-action fragments
      control_source: 07_model/examples/07_Mandatory_Stop.yaml#/claim/claim_scope/granularity
      inventory_status: extension
      extension_rationale: Local comparison between retained occurrence granularity and a contemplated unsupported finer reconstruction.
    relative_level:
      value: candidate internal fragments relative to one retained containment-closure occurrence
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Local wording instantiates the controlled relative-level relation.
    temporal_scope: Synthetic interval t0–t2 from open alert to verified closure.
    source_scope: One independently identifiable compressed occurrence plus boundary-state declarations and an explicit absence of internal 
      action and relation traces.
    context_scope: Formal smoke-test fixture only.
    generalization_boundary: No extension beyond this fixture and no claim that containment closures are generally indecomposable.
    excluded_reach:
      - No claim that internal actions did not occur or can never be reconstructed.
      - No operator-type decomposition and no new PMS primitive.
      - No causal, technical-safety, responsibility, legitimacy, or actor-level conclusion.
      - No person, institution, or real technical system is evaluated.
  validity_scope: Valid only as a synthetic demonstration that a relevant but source-detached DECOMPOSE continuation can require mandatory 
    stop before execution.
  claim_ceiling:
    asserted_relation: The retained occurrence and its closure function are source-supported at occurrence granularity, while the proposed 
      internal fragments and their function-carrying relations are not; continuation would cross mandatory continuity and traceability 
      boundaries.
    reach: The single synthetic occurrence eta, its opening and closure boundaries, and the contemplated three-fragment continuation.
    precision: Occurrence identity and boundary function are supported; candidate fragment identities, order, and function-carrying 
      relations are not.
    generality: Single synthetic fixture.
    functional_scope: The retained source function is only to register one verified containment-closure occurrence; no target function is 
      projected.
    dependence_strength: The stop claim depends on preserving the same reference object and on refusing to distribute the source function 
      across unsupported fragments.
    inferential_distance: One contemplated DECOMPOSE continuation assessed before unsupported fragment assertion.
    limiting_sources:
      - source.fixture.containment-closure.eta
      - source.fixture.internal-trace-gap.eta
    rationale: The sources support the occurrence-level result and the mandatory boundary, but not a positive internal reconstruction.
  authority_boundary: The record authorizes only formal routing of this synthetic stop claim; it grants no empirical truth, engineering 
    decision, causal attribution, or application authority.
