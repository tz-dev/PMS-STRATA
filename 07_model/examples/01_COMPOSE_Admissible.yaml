    request, an isolated approval, or an unordered event pair.
  selection_rule: Include exactly the request and approval events carrying fixture case identifier alpha; exclude all other
    events. The request event is first and the approval event second. Both are load-bearing.
  transformation_context: Synthetic formal-model smoke test of positive COMPOSE routing.
