  constitutive_source_trace:
    - trace_id: trace.component.compose.01
      source_feature: Record 01 establishes composite.authorization-sequence.alpha with origin type sequence and selected class admissible.
      affected_claim_component: First chain component and its local result.
      trace_role: load_bearing
      result_dependency: Without record 01 there is no source sequence for record 03 or the integrated test.
      expected_result_change: Removing record 01 defeats the chain declaration.
      temporal_or_relational_dependency: The request-before-approval relation at t0–t1 precedes the projected use at t2.
      claim_limitation: Supports only the local sequence claim and does not imply a target function or global regime.
      source_pointer: 07_model/examples/01_COMPOSE_Admissible.yaml
    - trace_id: trace.component.project-as.03
      source_feature: Record 03 projects the same sequence only as a bounded binding-function in synthetic scene gamma at t2.
      affected_claim_component: Second chain component and local target-function result.
      trace_role: load_bearing
      result_dependency: Without record 03 there is no projected function to integrate.
      expected_result_change: Removing or changing the gamma rule defeats the second component and the current chain input.
      temporal_or_relational_dependency: The source sequence identity and order are handed from record 01 into record 03.
      claim_limitation: Supports only gamma; it does not establish transfer, completeness, or authority.
      source_pointer: 07_model/examples/03_PROJECT_AS_Admissible.yaml
    - trace_id: trace.chain.boundary.08
      source_feature: Both component records explicitly prohibit authority inheritance and transfer beyond their declared scopes.
      affected_claim_component: Boundary of the attempted whole-chain claim.
      trace_role: limiting
      result_dependency: These local boundaries prevent the component outputs from constituting a complete global authorization regime.
      expected_result_change: Deleting the local boundaries would alter the record text but would not create missing cross-context evidence.
      temporal_or_relational_dependency: The chain must preserve rather than erase component-level boundedness.
      claim_limitation: This trace supports non-capture of the declared whole claim, not impossibility of future differently sourced 
        reconstruction.
      source_pointer: 07_model/examples/03_PROJECT_AS_Admissible.yaml#/claim/claim_scope/context_scope
  known_gaps:
    - No downstream context other than gamma is represented.
    - No rule composes one scene-bound function into a complete authorization regime.
    - No cross-context counterfactual matrix, rival scene rule, implementation behavior, or empirical system trace exists.
    - No source supports security sufficiency, legal authorization, institutional completeness, or global persistence.
  source_ceiling:
    asserted_relation: The source basis directly supports the two component records and their handoff but not the globally transferable 
      whole claim.
    reach: Two record identities, two local classes, component losses, source-sequence identity, constitutive order, gamma target rule, and 
      local boundaries.
    precision: Exact for the synthetic component declarations; absent for any further context.
    generality: Two local records only.
    functional_scope: Local sequence and gamma binding-function only.
    dependence_strength: Direct for component preservation; unsupported for global whole formation.
    inferential_distance: The whole claim requires a relation not present in either component record.
    limiting_sources:
      - source.record.compose.01
      - source.record.project-as.03
    rationale: Missing contexts alone do not mechanically establish non-capture; the decisive limit is that retaining the declared whole 
      would require erasing explicit component boundedness or inventing a whole-forming relation.
