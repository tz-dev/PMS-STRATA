claim:
  claim_id: claim.chain.authorization-regime.non-capture.08
  statement: The authorization sequence alpha and its scene-gamma binding-function together constitute a complete and globally transferable 
    authorization regime for all downstream access contexts.
  claim_type:
    value: integrated whole-chain authorization-regime claim
    control_source: 04_reference/Claim_Type_Table.md
    inventory_status: extension
    extension_rationale: Local integrated-claim type used only for this smoke record.
  claim_role:
    value: tested integrated claim
    control_source: 04_reference/Claim_Type_Table.md
    inventory_status: extension
    extension_rationale: Chain-level claim role distinct from both component claims.
  claim_scope:
    reference_object_boundary: Exactly the proposed whole formed from smoke records 01 and 03, not either component claim by itself.
    operation_occurrence_boundary: Integrated COMPOSE → PROJECT_AS chain only; no third operation and no new primitive.
    frame:
      value: cross-context downstream access frame
      control_source: 04_reference/Glossary.md
      inventory_status: extension
      extension_rationale: Attempted chain frame whose overreach is tested.
    granularity:
      value: integrated chain-level resolution
      control_source: 04_reference/Glossary.md
      inventory_status: extension
      extension_rationale: Local chain granularity label.
    relative_level:
      value: integrated result relative to two component occurrences
      control_source: 04_reference/Glossary.md
      inventory_status: extension
      extension_rationale: Local relative-level declaration.
    temporal_scope: t0–t2 for the component trace, with an attempted but unsupported extension to all later downstream contexts.
    source_scope: Only the two synthetic component records 01 and 03 and their declared source traces.
    context_scope: The attempted claim ranges beyond scene gamma to all downstream access contexts; that extension is the tested capture 
      boundary.
    generalization_boundary: No empirical system, security regime, institutional policy, legal authorization, or external context is 
      represented.
    excluded_reach:
      - causal sufficiency
      - security completeness
      - legal or normative authorization
      - global transfer from gamma
      - new PMS primitive or operator
  validity_scope: The record evaluates only whether the two existing local outputs can retain the declared global whole-chain claim under 
    current STRATA sources and boundaries.
  claim_ceiling:
    asserted_relation: The current sources establish one sequence and one scene-bound projected function but do not establish a complete 
      transferable regime.
    reach: Component identity, order, local gamma function, component classes, component losses, and the chain handoff.
    precision: Precise enough to reject false closure of the declared whole claim; insufficient to characterize unrepresented contexts.
    generality: One synthetic sequence, one synthetic target scene, and one integrated test claim.
    functional_scope: No functional scope beyond gamma is retained.
    dependence_strength: Direct component-record dependence; no independent cross-context dependence evidence.
    inferential_distance: One chain-level inferential step beyond two local results, tested and rejected as adequate capture.
    limiting_sources:
      - 07_model/examples/01_COMPOSE_Admissible.yaml
      - 07_model/examples/03_PROJECT_AS_Admissible.yaml
    rationale: The ceiling preserves the local records while withdrawing the global whole-chain claim.
  authority_boundary: This record grants no access, security, governance, legal, normative, institutional, or application authority.
