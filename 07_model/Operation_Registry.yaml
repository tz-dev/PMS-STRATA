      - backgrounded
      lossless_presumption_prohibited: true
    check_applicability:
      praxis_purchase:
        applicability: required
      traceable_load:
        applicability: required
      type_integrity:
        applicability: required
      reference_continuity:
        applicability: required
      functional_continuity:
        applicability: required
      temporal_continuity:
        applicability: conditional
        condition: Historical development, source sequence, temporal continuity, validity duration, persistence,
