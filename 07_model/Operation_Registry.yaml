  PROJECT_AS:
    operation_type: PROJECT_AS
    part_emphasis: RETYPE
    canonical_question: What bounded function may an origin-typed object perform within a declared target context?
    canonical_definition: Projects an origin-typed source object as a bounded function within a declared target
      context while preserving source reference and origin type.
    direction:
      source_form: origin-typed source object
      target_form: bounded contextual target function
      analytical_orientation: contextual functional projection rather than ontological ascent or descent
      ontological_direction_prohibited: true
    reference_logic:
      same_source_reference_required: true
      origin_type_preserved: true
      target_function_is_contextual_and_derived: true
      target_function_is_not_new_origin_type: true
      source_object_remains_valid_if_projection_fails: true
    source_contract:
      cardinality_rule: one independently identified origin-typed source object
