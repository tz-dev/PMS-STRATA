      - source features backgrounded by the projection
      - contextual visibility changes
      - historical or internal variation compressed by the target function
      - transfer limits and excluded contexts
      visibility_annotations_owner: constitutive_source_trace
      visibility_annotations_not_canonical_loss_fields:
