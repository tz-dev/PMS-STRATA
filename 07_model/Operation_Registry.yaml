        applicability: required
      counterfactual_sensitivity:
        applicability: required
      source_ceiling:
        applicability: required
      calibration:
        applicability: required
      selection_and_loss:
        applicability: required
      alternatives:
        applicability: required
      claim_ceiling:
        applicability: required
      authority_ceiling:
        applicability: required
