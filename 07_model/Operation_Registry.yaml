artifact:
  id: pms_strata_operation_registry
  title: PMS-STRATA Operation Registry
  version: 0.1.6
  status: formal_model_v0_provisional
  build_step: 1
  artifact_role: Machine-readable registry of the three canonical STRATA operation types and their controlled contracts.
  registered_scope:
  - operation type identity
  - operation type signatures
  - shared and operation-specific declaration duties
  - preservation and loss duties
  - check applicability metadata
  - operation-chain constraints
  - cross-artifact handoffs
  - open Chapter 1 object-category and identity-boundary handoff
  - open Chapter 2 coordinate, scope, comparison, and minimal-declaration handoff
  - open Chapter 3 temporal-object, historical-property, downgrade, and non-capture handoff
  - open Chapter 4 exact-operation, occurrence, chain, non-invertibility, confusion, and minimal-declaration handoff
  - open Chapter 5 origin-type, target-function, context, continuity, and minimal-projection handoff
  governing_authority_sources:
  - path: PMS.yaml
    role: unchanged external PMS Base dependency
  governing_repository_controls:
  - path: 00_source/PMS-STRATA_Structure.md
    role: architecture and chapter blueprint
  - path: 05_minified/PMS_STRATA_Claim_Boundary_Minified.md
    role: claim and authority boundary control
  - path: 05_minified/PMS_STRATA_Operation_Signatures_Minified.md
    role: primary operation-signature control
  - path: 05_minified/PMS_STRATA_Admissibility_Band_Minified.md
    role: shared admissibility boundary control
  - path: 05_minified/PMS_STRATA_Minified_Canonical.md
    role: canonical compact system control
  - path: 05_minified/Block_Contracts.md
    role: block-level production contract
  - path: 05_minified/Chapter_Contracts.md
    role: chapter-level production contract
  supporting_reference_inputs:
  - path: 04_reference/Transformation_Operation_Index.md
    role: terminological and cross-reference support without independent theory authority
  - path: 04_reference/Glossary.md
    role: terminology support without independent theory authority
  - path: 04_reference/Non_Equivalence_Index.md
    role: non-equivalence audit support without independent theory authority
  - path: 04_reference/Claim_Type_Table.md
    role: claim architecture support without independent theory authority
  - path: 04_reference/Output_Class_Index.md
    role: output-class support without redefinition or independent theory authority
  - path: 04_reference/Admissibility_Band_Reference.md
    role: admissibility support without independent theory authority
  - path: 04_reference/Evidence_Map.md
    role: support-role reference without independent theory authority
  - path: 04_reference/Audit_Checklist.md
    role: audit support without independent theory authority
  - path: 04_reference/Reader_Pathways.md
    role: formal-model build and reading route support without independent theory authority
  prose_precedence: This registry mirrors and tests controlled prose. It does not replace PMS Base, controlled prose,
    including later provisionally or finally locked canonical corpus prose, or substantive human and domain-grounded
    judgment.
  non_authority_statement: Registration, YAML validity, schema validity, formal completeness, operation count, or
    chain length do not establish substantive admissibility, empirical truth, actual causality, semantic validity,
    normative validity, person judgment, legitimacy, or application authority.
registry_constraints:
  exact_operation_count: 3
  canonical_operation_ids:
  - COMPOSE
  - DECOMPOSE
  - PROJECT_AS
  canonical_parts:
  - PATH
  - SUB
  - RETYPE
  - LIMITS
  part_operation_relation:
    PATH:
      primary_operation: COMPOSE
    SUB:
      primary_operation: DECOMPOSE
    RETYPE:
      primary_operation: PROJECT_AS
    LIMITS:
      primary_operation: null
      is_operation: false
      is_meta_level: false
  fourth_operation_prohibited: true
  compound_chain_operation_prohibited: true
  limits_not_an_operation: true
  operation_type_occurrence_output_chain_separated: true
  pms_base_operators_unchanged: true
  pms_base_operator_sequence_unchanged: true
  pms_base_operator_dependencies_unchanged: true
  new_pms_primitive_prohibited: true
  authority_inheritance: prohibited
shared_operation_contract:
  operation_entry_required_keys:
  - operation_type
  - part_emphasis
  - canonical_question
  - canonical_definition
  - direction
  - reference_logic
  - source_contract
  - target_contract
  - required_declaration_families
  - constitutive_duties
  - preservation_duties
  - loss_duties
  - check_applicability
  - confusion_boundaries
  - outcome_routing_handoffs
  - chain_participation
  - non_invertibility
  - prohibited_inferences
  common_declaration_families:
  - id: source
    occurrence_burden: Declare source object or source set, source-side typing, coordinates, temporal scope where
      relevant, source basis, and support limits.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: operation
    occurrence_burden: Reference exactly one operation type and declare justification, expected praxeological difference,
      and transformation context.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: target
    occurrence_burden: Declare the operation-appropriate target object or target function and its analytical coordinates
      and validity scope.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: claim
    occurrence_burden: Declare claim type, claim scope, and claim ceiling without inferring support or authority
      from the type label.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: loss
    occurrence_burden: Populate the exact five-part canonical loss structure.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: admissibility
    occurrence_burden: Assess every required check and resolve every conditional check without converting form completion
      into substantive passage.
    record_owner: 07_model/Transformation_Record.schema.json
    rule_owner: 07_model/Admissibility_Rules.yaml
  - id: alternatives
    occurrence_burden: Represent rival transformations, the no-transformation option, and non-translation where
      relevant.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: stop
    occurrence_burden: Declare stop conditions, whether they are reached, and the relation to mandatory stop or
      optional stop.
    record_owner: 07_model/Transformation_Record.schema.json
    rule_owner: 07_model/Admissibility_Rules.yaml
  - id: governance
    occurrence_burden: Preserve claim and authority ceilings and prohibit authority inheritance.
    record_owner: 07_model/Transformation_Record.schema.json
  - id: result
    occurrence_burden: Record a local operation result separately from exactly one canonical Output Class for the
      tested claim.
    record_owner: 07_model/Transformation_Record.schema.json
    output_class_owner: 07_model/Output_Classes.yaml
    route_selection_owner: 07_model/Boundary_Decision_Tree.yaml
  canonical_loss_fields:
  - preserved
  - compressed
  - excluded
  - uncertain
  - irrecoverable
  additional_canonical_loss_fields_prohibited: true
  common_check_ids:
  - praxis_purchase
  - traceable_load
  - type_integrity
  - reference_continuity
  - functional_continuity
  - temporal_continuity
  - contextual_boundedness
  - counterfactual_sensitivity
  - source_ceiling
  - calibration
  - selection_and_loss
  - alternatives
  - claim_ceiling
  - authority_ceiling
  - stop
  - non_capture
  check_applicability_values:
    required: The occurrence must provide a substantive assessment.
    conditional: The occurrence must assess the check when its stated condition applies; otherwise it must declare
      not_applicable with condition and rationale.
    not_applicable: Occurrence-level resolution for a conditional check only; it is not equivalent to passed and
      requires a rationale.
  free_optional_admissibility_gate_prohibited: true
  preservation_duty_applicability:
    mode: required_where_constitutive
    applicability_must_be_assessed: true
    non_applicability_requires_rationale: true
    preservation_duty_list_is_not_universal_content_requirement: true
  diagnostic_family_list_closure:
    candidate_trigger_families_closed: false
    confusion_boundaries_closed: false
    reason_families_closed: false
    prohibited_inferences_are_minimum_not_exhaustive: true
  common_outcome_route_ids:
  - mandatory_stop
  - claim_reduction_required
  - failed_transformation
  - non_capture
  routing_does_not_equal_decision: true
  common_stop_failure_non_capture_boundary:
    stop_is_positive_result: true
    mandatory_stop: Continuation is inadmissible under a reached load-bearing stop condition.
    optional_stop: Continuation is unnecessary even though the current bounded result may remain admissible.
    failed_transformation: The attempted operation fails its signature or applicable admissibility conditions under
      the tested claim.
    claim_reduction_required: A narrower claim remains supportable while the original claim exceeds its warranted
      ceiling.
    non_capture: No adequate retained STRATA claim remains without distortion, unsupported extension, false closure,
      or destruction of a constitutive source feature.
    missing_information_not_equal_non_capture: true
    later_transformation_does_not_erase_prior_failure: true
  common_authority_boundary:
    authority_inheritance: prohibited
    more_structure_not_more_authority: true
    successful_transformation_only_increases_bounded_legibility: true
    person_typing_prohibited: true
    diagnosis_prohibited: true
    automatic_action_recommendation_prohibited: true
    political_or_legal_legitimacy_decision_prohibited: true
  common_non_invertibility_boundary:
    reverse_movement_is_new_occurrence: true
    restoration_of_untouched_original_not_presumed: true
    loss_must_be_reassessed: true
    new_transformation_is_new_testable_claim: true
