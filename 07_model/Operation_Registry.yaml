operation_types:
  COMPOSE:
    operation_type: COMPOSE
    part_emphasis: PATH
    canonical_question: How may multiple or sequential source structures form a declared composite analytical object?
    canonical_definition: Forms a declared composite analytical object from multiple temporally or structurally
      related source objects while making selection, ordering, formation, compression, and loss explicit.
    direction:
      source_form: many or sequential source structures
      target_form: new composite analytical object
      analytical_orientation: frequently relative upward composition
      ontological_direction_prohibited: true
    reference_logic:
      creates_new_analytical_object: true
      source_references_must_remain_traceable: true
      source_objects_do_not_become_new_pms_primitives: true
      new_composite_not_equal_automatic_target_function: true
    source_contract:
      cardinality_rule: multiple objects, a declared sequence, or multiple structurally related source structures
      recognized_object_families:
      - configuration
      - transition as object
      - event-like object
      - non-event structure
      - subpath
      - branch structure
      - partial trajectory
      - operator-typed occurrence
      - composite structure
      recognized_object_families_closed: false
      prohibited_source_kinds:
      - unrelated list without a declared constitutive relation
      - source set identified only by retrospective target convenience
      source_identity_requirements:
      - each source object is identifiable
      - source-side typing remains visible
      - source frame and granularity are declared
      - temporal scope is declared where temporality is relevant
      - source support and uncertainty are bounded
    target_contract:
      primary_result_kind: composite analytical object
      recognized_result_families:
      - sequence
      - path
      - trajectory
      - event cluster
      - branch structure
      - phase
      - other explicitly declared composite
      recognized_result_families_closed: false
      target_identity_requirements:
      - target object is distinct from the source list or chronology
      - target object class is declared
      - formation relation is explicit
      - source trace remains reconstructible
      - validity scope and claim ceiling are bounded
      prohibited_automatic_results:
      - target function
      - frame-function
      - macro-event function
      - attractor-function
      - new PMS primitive
      - authority increase
    required_declaration_families:
      shared:
      - source
      - operation
      - target
      - claim
      - loss
      - admissibility
      - alternatives
      - stop
      - governance
      - result
      operation_specific:
      - source_objects
      - source_typings
      - ordering_rule
      - selection_rule
      - formation_rule
      - constitutive_relations
      - target_object
      - target_object_class
      - source_trace
    constitutive_duties:
      selection_rule:
      - state why included elements are included
      - state why omitted elements are omitted
      - distinguish load-bearing from illustrative elements
      - mark contested selection
      ordering_rule:
      - declare temporal or structural ordering
      - mark uncertainty and retrospective periodization
      - do not infer a path from chronological order alone
      formation_rule:
      - explain why the result is more than a collection or chronology
      - identify relations that constitute the target object
      - distinguish sequence, path, trajectory, and other composite burdens
      constitutive_relations:
      - identify load-bearing temporal, structural, branch, asymmetry, binding, or non-event relations
      - retain relations necessary for counterfactual source sensitivity
    preservation_duties:
    - source trace
    - relevant temporal order
    - load-bearing transitions
    - central events and non-events
    - historically relevant asymmetries
    - binding structures
    - branch points and lost alternatives
    - internal heterogeneity necessary to the claim
    - distinction between source types and the new composite object
    loss_duties:
      canonical_structure_required: true
      canonical_fields:
      - preserved
      - compressed
      - excluded
      - uncertain
      - irrecoverable
      operation_specific_attention:
      - local detail
      - internal variation
      - parallel minor paths
      - fine temporal resolution
      - separability of local costs
      - historical alternatives not recoverable from the composite alone
      lossless_presumption_prohibited: true
    check_applicability:
      praxis_purchase:
        applicability: required
      traceable_load:
        applicability: required
      type_integrity:
        applicability: required
      reference_continuity:
        applicability: required
      functional_continuity:
        applicability: conditional
        condition: The composition claim carries, preserves, revises, or compares a source or coarser function rather
          than forming only a declared object relation.
