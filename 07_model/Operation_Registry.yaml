      non_capture_requires_no_adequate_retained_strata_claim_or_relation: true
    confusion_boundaries:
    - candidate: recontextualization
      not_equivalent_to: PROJECT_AS
      distinguishing_burden: A frame or reading change alone is insufficient; a source-dependent bounded target
        function must be declared.
    - candidate: analogy
      not_equivalent_to: functional projection
      distinguishing_burden: Formal or structural resemblance without semantic and praxeological continuity supports
        analogy only, not PROJECT_AS.
    - candidate: label substitution or renaming
      not_equivalent_to: PROJECT_AS
      distinguishing_burden: The target function must create discriminative gain and respond to material changes
        in the constitutive source trace.
    - candidate: origin-type replacement or type jump
      not_equivalent_to: bounded target function
      distinguishing_burden: Origin type remains unchanged and visible; the target function is contextual and derived.
    - candidate: unmarked level mixing
      not_equivalent_to: declared relative-level projection
      distinguishing_burden: Source and target levels, frames, granularities, and context must be separately declared.
