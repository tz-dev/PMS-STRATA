      claim_reduction_required:
        output_class_owner: 07_model/Output_Classes.yaml
        rule_owner: 07_model/Admissibility_Rules.yaml
        decision_owner: 07_model/Boundary_Decision_Tree.yaml
        candidate_trigger_families:
        - narrow context-bound function remains supportable but broader transfer does not
        - a narrower source-dependent target function remains supportable while the original projection does not
        - some source features support a limited projection while the original target claim exceeds traceability
          or validity scope
        original_claim_must_remain_recorded: true
        automatic_from_registry: false
      failed_transformation:
        output_class_owner: 07_model/Output_Classes.yaml
        rule_owner: 07_model/Admissibility_Rules.yaml
        decision_owner: 07_model/Boundary_Decision_Tree.yaml
        candidate_trigger_families:
        - target context is absent
        - target function is only a new name
        - origin type is replaced
        - source and target levels are mixed
        - constitutive source trace is absent
        - projection is source-insensitive
        - local function is globalized or treated as a person essence
        silent_operation_switch_prohibited: true
        automatic_from_registry: false
      non_capture:
        output_class_owner: 07_model/Output_Classes.yaml
        rule_owner: 07_model/Admissibility_Rules.yaml
        decision_owner: 07_model/Boundary_Decision_Tree.yaml
        candidate_trigger_families:
        - no projection preserves source type, reference, and constitutive load
        - competing projections remain equally viable without a warranted selection
        - no adequate retained STRATA claim or source-target relation remains after the projection claim is tested
        - the source-target relation is better represented outside the present STRATA grammar
        weak_claim_shield_prohibited: true
        automatic_from_registry: false
    chain_participation:
      may_participate_in_chains: true
      recognized_outgoing_examples:
      - DECOMPOSE
      recognized_outgoing_examples_closed: false
      separate_occurrence_required_for_each_link: true
      successful_projection_does_not_validate_prior_compose_or_decompose: true
    non_invertibility:
      canonical_statement: PROJECT_AS(X) != X as a new origin type
      reason_families:
      - contextual function is not origin-type identity
      - foregrounding and backgrounding change analytical visibility
      - validity is context-bound
      - projection loss and transfer limits remain
      reverse_movement_requires_new_occurrence: true
      origin_type_replacement_prohibited: true
    prohibited_inferences:
    - target function is a new origin type
    - target function is a new PMS primitive
    - recontextualization alone is PROJECT_AS
    - analogy establishes semantic or functional identity
    - formal mapping establishes praxeological preservation
    - local target function transfers globally
    - contextual function is a person-level property
    - counterfactual sensitivity proves causality
    - formal completion establishes substantive projection admissibility
    - projection increases claim or application authority
operation_chain_contract:
  chain_is_operation_type: false
  chain_is_compound_fourth_operation: false
  chain_definition: An ordered sequence of separately declared operation occurrences.
  recognized_chain_examples:
  - - COMPOSE
    - PROJECT_AS
  - - COMPOSE
    - DECOMPOSE
  - - DECOMPOSE
    - COMPOSE
  - - DECOMPOSE
    - PROJECT_AS
  - - PROJECT_AS
    - DECOMPOSE
  - - COMPOSE
    - PROJECT_AS
    - DECOMPOSE
  recognized_chain_examples_closed: false
  each_link_requirements:
  - unique occurrence record identifier
  - exactly one operation type reference
  - own source and target declaration
  - own justification
  - own claim and claim ceiling
  - own canonical five-part loss profile
  - own admissibility assessment
  - own local result and canonical Output Class
  - own stop and non-capture status
  - independent criticizability and stoppability
  preservation_across_chain:
  - prior claims
  - prior losses
  - prior outputs
  - prior stop records
  - prior failures
  - countercases and rival records
  preservation_applies_where_present: true
  artificial_generation_of_absent_prior_records_not_required: true
  validity_inheritance: prohibited
  authority_inheritance: prohibited
  later_link_retroactive_validation: prohibited
  silent_claim_replacement: prohibited
  reverse_link_rule: A reverse analytical movement requires a new occurrence and does not invert or erase the prior
    link.
formal_model_boundary:
  may_validate:
  - structural completeness
  - declared operation identity
  - allowed fields and technical vocabularies
  - presence of required declaration families
  - type-integrity declarations
  - declared boundary conditions
  - canonical Output Class membership
  - schema, registry, and cross-artifact consistency
  may_not_determine:
  - empirical truth
  - actual causality
  - semantic validity
  - normative validity
  - person evaluation or diagnosis
  - political legitimacy
  - legal legitimacy
  - application authority
  - whether a selected reconstruction is substantively best
  - whether a source-dependent function is materially warranted
  non_inference_equivalences:
  - registered operation type != admissible operation occurrence
  - complete occurrence record != substantively warranted transformation
  - valid YAML != empirical truth
  - valid schema != actual causality
  - formal consistency != semantic or normative validity
  - more detail != higher truth
  - more operations != stronger claim
  - successful transformation != application authority
  implementation_safeguards:
    automatic_admissibility_inference_prohibited: true
    aggregate_admissibility_score_prohibited: true
    weighted_gate_compensation_prohibited: true
    field_presence_as_substantive_pass_prohibited: true
    chain_length_as_authority_prohibited: true
    granularity_as_authority_prohibited: true
    formal_detail_as_authority_prohibited: true
    human_or_domain_grounded_judgment_required: true
cross_artifact_handoffs:
  07_model/Operation_Registry.yaml:
    owns:
    - exactly three operation types
    - operation identities and signatures
    - operation-specific declaration duties
    - preservation and loss duties
    - check applicability metadata
    - operation-chain constraints
  07_model/Output_Classes.yaml:
    owns:
    - exact ten canonical Output Classes
    - class identity, meaning, and class boundaries
    registry_relation: reference only; do not redefine classes or select routes here
  07_model/Admissibility_Rules.yaml:
    owns:
    - check semantics
    - check result vocabularies
    - non-compensation rules
    - stop and claim-ceiling rules
    registry_relation: registry lists check identifiers and operation-level applicability only
  07_model/Boundary_Decision_Tree.yaml:
    owns:
    - movement classification
    - route selection
    - confusion routing
    - collision and routing precedence
    registry_relation: registry states boundaries and diagnostic handoffs only
  07_model/Transformation_Record.schema.json:
    owns:
    - concrete operation-occurrence fields
    - required-value syntax
    - record-level conditional validation
    registry_relation: registry lists semantic declaration families without occurrence values
  07_model/PMS-STRATA.yaml:
    owns:
    - formal-model manifest
    - artifact relationships
    - package-level model assembly
    registry_relation: registry is one referenced model component
  07_model/PMS-STRATA.schema.json:
    owns:
    - package-level schema validation
    registry_relation: no package-schema duplication
  07_model/examples/*:
    owns:
