      - source object has an independent source-side reconstruction
      - origin type is declared and remains visible
      - source frame, granularity, relative level, and temporal scope are declared where relevant
      - source support and continuity limits are explicit
    target_contract:
      primary_result_kind: bounded contextual target function
      recognized_result_families:
      - frame-function
      - macro-event function
      - attractor-function
      - asymmetry-function
      - binding-function
      - integration-function
      - modulating function
      - higher-level boundary function
      - other explicitly justified derived function
      recognized_result_families_closed: false
      target_identity_requirements:
      - target context is declared
      - target object or scene is declared
      - target function is named separately from origin type
      - constitutive source trace is explicit
      - target frame, granularity, relative level, validity duration, transfer limits, and claim ceiling are bounded
        where relevant
      prohibited_automatic_results:
      - origin-type replacement
      - new PMS primitive
      - global transfer beyond validity scope
      - person-level property
      - semantic identity from analogy
      - authority increase
    required_declaration_families:
      shared:
      - source
      - operation
      - target
      - claim
      - loss
      - admissibility
      - alternatives
      - stop
      - governance
      - result
      operation_specific:
      - source_object
      - origin_type
      - target_context
      - target_object
      - target_function
      - target_frame
      - constitutive_source_trace
      - source_reference_preserved
      - origin_type_preserved
      - target_function_bounded
      - validity_scope
      - alternative_projection_or_no_projection
    constitutive_duties:
      target_context:
      - declare the scene, object, frame, relative level, and validity scope within which the function is claimed
      - mark temporal duration and transfer limits where relevant
      constitutive_source_trace:
      - identify load-bearing source features
      - distinguish load-bearing from modulating features
      - identify foregrounded, backgrounded, compressed, excluded, and uncertain source features
      - show how target function changes under relevant source changes
      type_integrity:
      - preserve source reference
      - preserve origin type
      - separate source and target levels
      - separate target function from origin type and PMS primitive status
      alternative_duty:
      - represent at least one relevant alternative projection
      - represent the no-projection option
      - permit analogy-only or non-translation where source-dependent functional continuity is not established
    preservation_duties:
    - source reference
    - origin type
    - relevant historical continuity
    - load-bearing source relations
    - distinction between source level and target level
    - distinction between origin type and target function
    - possibility that projection fails while source object remains valid
    loss_duties:
      canonical_structure_required: true
      canonical_fields:
      - preserved
      - compressed
      - excluded
      - uncertain
      - irrecoverable
      operation_specific_attention:
