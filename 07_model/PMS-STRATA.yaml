      - actual checksum calculation and comparison
      - component ID, version, and status comparison
      - cross-file inventory equality
      - dependency endpoint resolution
      - semantic-cycle detection
      - schema-ID and route-ID resolution
      json_schema_alone_is_sufficient: false
    substantive_judgment:
      formal_executor: null
      not_decidable_by_formal_model: true
