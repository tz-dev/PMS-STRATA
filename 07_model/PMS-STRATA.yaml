    algorithm: sha256
    package_resolver_required: true
  validation_layers:
    static_root_schema_validation:
      executor: 07_model/PMS-STRATA.schema.json
      may_validate:
      - required root fields and descriptor structure
      - path, version, status, and SHA-256 formats
      - exact closed-inventory snapshots
      - current open-inventory snapshot structure
      - allowed dependency-edge types and endpoint syntax
      - ownership-matrix structure
      - workflow-step completeness
      - prohibited safeguard values
    package_resolver_validation:
      executor: package-aware validator or smoke-test harness
      required_for:
