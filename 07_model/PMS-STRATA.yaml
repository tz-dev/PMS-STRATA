open_inventory_contract:
  open_inventory_does_not_mean_uncontrolled_free_text: true
  current_snapshot_must_match_owner: true
  extension_requires_owner_control_source_and_rationale: true
  root_may_not_create_extension: true
  root_update_required_after_valid_owner_revision: true
  record_local_extension_does_not_revise_owner_inventory: true
  record_local_extension_does_not_change_root_snapshot: true
  owner_inventory_revision_requires_root_snapshot_update: true
  open_inventories:
  - class_boundaries
  - formal_diagnostics
integrated_workflow:
  workflow_is_not_a_fourth_operation: true
  workflow_is_not_an_additional_audit_stage: true
  workflow_order_is_not_authority_rank: true
  output_mapping_occurs_after_the_twelve_stage_audit: true
  one_output_class_per_delimited_routed_claim: true
  formal_diagnostic_has_no_output_class: true
  workflow_owner_contract:
    primary_process_owner_does_not_override_ownership_matrix: true
    input_semantics_retain_their_upstream_owners: true
    encoding_ownership_does_not_create_semantic_ownership: true
  steps:
  - order: 1
    step_id: bind_assembly_snapshot
    primary_process_owner: 07_model/PMS-STRATA.yaml
    inputs:
    - governing controls
    - component descriptors
    - registered fingerprints
    outputs:
    - bound formal-model assembly snapshot
    prohibited_inference: checksum agreement or manifest completeness proves semantic correctness
  - order: 2
    step_id: identify_operation_or_chain_scope
    primary_process_owner: 07_model/Operation_Registry.yaml
    inputs:
    - source structures
    - analytical purpose
    - operation-selection rationale
    outputs:
    - one operation occurrence or integrated chain of separately identified occurrences
    prohibited_inference: an integrated chain is a fourth operation
  - order: 3
    step_id: enter_source_claim_context_and_record_declarations
    primary_process_owner: 07_model/Transformation_Record.schema.json
    inputs:
    - source declaration
    - claim declaration
    - context
    - operation or chain identity
    outputs:
    - audit-ready record packet
    prohibited_inference: field completeness establishes substantive warrant
  - order: 4
    step_id: execute_twelve_stage_audit
    primary_process_owner: 07_model/Admissibility_Rules.yaml
    inputs:
    - audit-ready record packet
    - applicable Rule profiles
    outputs:
    - twelve-stage findings and triggered payloads
    prohibited_inference: audit completion is an automatic admissibility pass
  - order: 5
    step_id: preserve_local_findings_and_record_axes
    primary_process_owner: 07_model/Admissibility_Rules.yaml
    inputs:
    - Rule findings
    - support axes
    - loss
    - alternatives
    - Stop and Non-Capture assessments
    outputs:
    - complete cross-rule pattern with preserved local results
    prohibited_inference: local finding independently selects a final class
  - order: 6
    step_id: assess_routing_readiness
    primary_process_owner: 07_model/Boundary_Decision_Tree.yaml
    inputs:
    - complete cross-rule pattern
    - audit-to-routing basis
    - Rule-specific rationales
    outputs:
    - routing-ready packet or formal diagnostic
    prohibited_inference: formal incompleteness is failed_transformation, mandatory_stop, or non_capture
  - order: 7
    step_id: generate_class_candidates
    primary_process_owner: 07_model/Boundary_Decision_Tree.yaml
    inputs:
    - routing-ready full applicable pattern
    - ten-class inventory
    outputs:
    - candidate assessments
    prohibited_inference: first match, score, rank, or single Rule determines the route
  - order: 8
    step_id: segment_claims_and_records_where_required
    primary_process_owner: 07_model/Boundary_Decision_Tree.yaml
    inputs:
    - candidate assessments
    - claim and occurrence axes
    outputs:
    - delimited Same-Claim packets or separated claim/record packets
    prohibited_inference: multiple material findings require class stacking on one undifferentiated claim
  - order: 9
    step_id: adjudicate_same_claim_collisions
    primary_process_owner: 07_model/Boundary_Decision_Tree.yaml
    inputs:
    - Same-Claim candidates
    - current class-boundary controls
    outputs:
    - resolved candidate set or formal diagnostic
    prohibited_inference: class ranking, default precedence, or unchanged candidate loops are permitted
  - order: 10
    step_id: select_unique_route_or_retain_diagnostic
    primary_process_owner: 07_model/Boundary_Decision_Tree.yaml
    inputs:
    - resolved candidate set
    - constitutive-condition recheck
    outputs:
    - one canonical Output Class per routed claim or formal diagnostic without class
    prohibited_inference: Output Class automatically determines Claim Disposition or application authority
  - order: 11
    step_id: encode_and_validate_transformation_record
    primary_process_owner: 07_model/Transformation_Record.schema.json
    inputs:
    - selected route or formal diagnostic
    - authoritative record axes
    - relations and preservation duties
    outputs:
    - schema-valid Transformation Record or structural validation errors
    prohibited_inference: schema-valid record proves substantive admissibility or truth
  - order: 12
    step_id: perform_package_and_cross_record_checks
    primary_process_owner: future package validator and 07_model/examples/* smoke tests
    inputs:
    - root manifest
    - component files
    - records
    - cross-record relations
    outputs:
    - package-integrity and cross-record validation report
    prohibited_inference: package-level consistency resolves substantive judgment or completeness of capture
record_and_schema_handoff:
  record_schema:
    path: 07_model/Transformation_Record.schema.json
    schema_id: https://pms-strata.local/schema/Transformation_Record.schema.json
    version: 0.1.3
    json_schema_draft: 2020-12
    supported_record_scopes: *id001
    supported_routing_states: *id002
  authoritative_axis_contract:
    owner: 07_model/Transformation_Record.schema.json
    root_mirrors_pointers_without_redefining_syntax: true
    pointers:
      resolution_test_result: /result/status_declaration/resolution_test_result
      source_function_effect: /result/operation_specific_result/source_function_effect
      claim_disposition: /result/routing/current_claim_disposition
      project_as_target_function: /target/contextual_function
      candidate_assessments: /result/routing/candidate_assessments
      claim_ceiling: /claim/claim_ceiling
      operation_selection_rule: /operation/selection_rule
      current_tested_claim: /claim/claim_id
      candidate_boundary_adjudications: /result/routing/candidate_assessments
  status_and_result_axis_separation:
  - support status != canonical Output Class
  - resolution test result != canonical Output Class
  - Claim Disposition != canonical Output Class
  - capture statement != automatic non_capture
  - local operation result != final route
  - formal diagnostic != canonical Output Class
  record_validation_owner: 07_model/Transformation_Record.schema.json
  root_validates_concrete_records: false
  root_registers_record_contract: true
package_level_deferred_checks:
  executor:
  - future package validator
  - 07_model/examples/* smoke-test harness
  root_registers_but_does_not_claim_execution: true
  checks:
  - external PMS fingerprint matches the registered SHA-256 value
  - governing repository control fingerprints match their registered SHA-256 values
  - supporting reference input fingerprints match their registered SHA-256 values
  - registered component files exist at their paths
  - actual component hashes match manifest fingerprints
  - build-snapshot fingerprint matches where the provenance artifact is available
  - component-declared IDs, versions, statuses, and build steps match the manifest
  - mirrored inventories equal their owning files
  - dependency-graph edges equal component-manifest dependency-list projections
  - component graph-node paths equal component-manifest paths
  - audit-stage Rule-binding snapshot equals Admissibility_Rules.yaml
  - authoritative-pointer snapshot equals Transformation_Record.schema.json
  - validation-companion content status matches the actual file-content state
  - all dependency endpoints resolve
  - no prohibited semantic or record-encoding dependency cycle exists
  - referenced claim and record IDs exist
  - chain reference count matches declared operation sequence
  - external occurrence order is consistent
  - claim and record relation graphs are acyclic
  - segment references resolve
  - source and target object IDs agree across linked records
  - each final route maps to exactly one canonical Output Class
  - no formal diagnostic is stored as a canonical Output Class
  - each example declares the component versions against which it was validated
  cross_file_execution_required: true
  json_schema_alone_cannot_execute_all_checks: true
formal_model_boundary:
  may_validate:
  - component identity, format, version, status, build step, and declared fingerprint
  - structural completeness of the root instance
  - exact closed-inventory equality
  - current open-inventory snapshot equality
  - ownership and dependency consistency
  - operation, Rule, class, stage, boundary, route, scope, and state identifier consistency
  - workflow and record-schema handoff completeness
  - absence of prohibited scoring, ranking, compensation, fourth-operation, eleventh-class, and authority-inheritance structures
  may_not_determine:
  - empirical truth
  - actual causality
  - semantic validity
  - normative validity
  - person evaluation or diagnosis
  - political or legal legitimacy
  - material source sufficiency
  - application authority
  - substantive superiority of a reconstruction
  - completeness of capture
  required_non_equivalences:
  - valid component manifest != valid substantive model claim
  - matching checksum != semantic correctness
  - cross-artifact consistency != empirical truth
  - schema-valid record != admissible transformation
  - selected route != application authorization
  - formal-model completeness != PMS completeness
  - root manifest != meta-PMS
  - more structure != more authority
  authority_inheritance: prohibited
downstream_handoffs:
  root_schema:
    path: 07_model/PMS-STRATA.schema.json
    role: validate the root structure without redefining components
  examples:
    path_pattern: 07_model/examples/*
    role: positive and negative smoke tests of the integrated model
    required_for_formal_model_v0_gate: true
    examples_are_not_theory_sources: true
  appendices:
    path_pattern: 02_appendices/Appendix_[C-N]_*.md
    role: derive templates and audit structures without redefining the formal model
  cases:
    path_pattern: 03_cases/*
    role: test operations, rules, routes, Stop, Non-Capture, and chains without revising upstream semantics
  reader:
    path_pattern: 08_PMS-STRATA Reader/*
    role: navigate and present the model without becoming an authority source
  downstream_semantic_backflow: prohibited
