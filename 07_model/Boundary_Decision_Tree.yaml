      lexical_selection_prohibited: true
      substantive_judgment_required: true
      claim_split_required_when_both_results_retained: true
      routing_effect:
        - route the PROJECT_AS occurrence to failed_transformation where the projection claim fails its necessary conditions
        - route the separately delimited retained analogy claim to analogy_only where its own conditions are met
        - do not stack analogy_only and failed_transformation on one undifferentiated claim
operation_specific_routing_overlays:
  COMPOSE:
    operation_id: COMPOSE
    operation_identity_owner: 07_model/Operation_Registry.yaml
    routing_emphases:
      - traceable source selection
      - order and constitutive relation
      - composite formation rather than aggregation
      - declared loss and alternatives
    minimum_confusion_controls:
      - chronology != COMPOSE
      - aggregation != composite formation
      - composite object != contextual target function
    routing_safeguards:
      - coherent macro-label without traceable formation does not become admissible automatically
      - operation-specific result remains separate from final Output Class
  DECOMPOSE:
    operation_id: DECOMPOSE
    operation_identity_owner: 07_model/Operation_Registry.yaml
    required_separate_axes:
      - DECOMPOSE operation result and class
      - source-function effect
      - prior source-claim result
    resolution_neutral_preconditions:
      - valid resolution or granularity test
      - source-supported added distinctions
      - unchanged warranted reconstruction
    routing_safeguards:
      - valid decomposition may reject or refine a source-function claim without failed_transformation
      - unsupported refinement routes by operation-failure or continuation-boundary analysis
      - finer resolution has no automatic truth priority
  PROJECT_AS:
    operation_id: PROJECT_AS
    operation_identity_owner: 07_model/Operation_Registry.yaml
    minimum_confusion_controls:
      - origin type != target function
      - projection != analogy != label substitution
      - recontextualization != PROJECT_AS
    required_confusion_branches:
      - useful bounded analogy -> analogy_only for a separately delimited analogy claim
      - label substitution -> ordinarily failed_transformation for the PROJECT_AS claim
      - invalid type jump -> failed_transformation
      - unmarked level mixing -> failed_transformation
      - materially narrow already-tested projection -> admissible_with_bounded_claim
      - ordinary complete contextual separation without further narrowing -> may remain admissible
      - competing projections -> provisional, partial, or non_capture according to the retained claim
    routing_safeguards:
      - analogy_only does not validate PROJECT_AS
      - failed projection and retained analogy require separate claims or record segments
      - target function remains contextual and does not become a PMS primitive
stop_reduction_failure_non_capture_contract:
  optional_stop:
    creates_canonical_class: false
    meaning: continuation remains admissible but is unnecessary for the current claim
    may_coexist_with_retained_classes:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
    may_coexist_with_retained_classes_is_non_exhaustive: true
    must_not_route_to_mandatory_stop_without_inadmissible_continuation: true
  mandatory_stop:
    select_when: inadmissible continuation under present conditions is the primary governance result for the current claim or stage
    not_equivalent_to:
      - workflow blockage
      - automatic falsity
      - proof of non-capture
      - prohibition of all future re-entry
    prior_valid_results_preserved: true
  claim_reduction_required:
    select_when: the current claim is too strong and a grounded weaker formulation warrants reformulation and retesting
    reduced_claim_pre_authorized_as_admissible: false
    original_failure_or_overreach_preserved: true
  failed_transformation:
    select_when: the declared operation claim fails identity or necessary conditions
    does_not_automatically_invalidate:
      - source object
      - every rival operation
      - separately retained analogy
      - future re-entry
  non_capture:
    select_when: no adequate retained claim remains for the same delimited claim after bounded tests and alternatives
    mechanical_triggers_prohibited:
      - missing fields
      - missing sources
      - unknown events
      - unavailable counterfactuals
      - one failed operation
      - partial capture elsewhere
    captured_and_uncaptured_remainders_preserved_where_present: true
  no_default_precedence_between_these_results: true
  controlled_boundary_questions_required: true
chain_and_anti_immunization_contract:
  each_operation_occurrence_receives_own_class: true
  later_operation_does_not_overwrite_earlier_result: true
  new_transformation_is_new_testable_claim: true
  earlier_failed_reduced_stopped_or_noncaptured_claims_remain_visible: true
  chain_summary_cannot_upgrade_local_results: true
  reentry_requires_changed_grounds: true
  reentry_requires_new_or_revised_record: true
  later_operation_may_not_be_declared_to_answer_earlier_objection_automatically: true
  formal_tree_may_validate_declared_separation_but_not_substantive_resolution: true
confusion_routes:
  confusion_route_inventory_closed: false
  minimum_current_count: 16
  canonical_candidate_handoffs_are_non_exhaustive: true
  canonical_candidate_handoffs_are_not_final_routes: true
  process_handoffs_must_resolve_to_route_nodes: true
  formal_diagnostic_handoffs_must_resolve_to_diagnostic_nodes: true
  confusion_routes_may_have_empty_canonical_candidate_handoffs: true
  noncanonical_findings_must_not_be_encoded_as_candidate_classes: true
  routes:
    - confusion_route_id: ordinary_boundedness_vs_bounded_claim
      confusion: ordinary contextual boundedness versus bounded-claim output
      routing_question: Is material narrowing itself the decisive result, beyond ordinary required boundedness?
      canonical_candidate_handoffs:
        - admissible
        - admissible_with_bounded_claim
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: ordinary boundedness must not automatically produce admissible_with_bounded_claim
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: provisional_whole_vs_partial_results
      confusion: one coherent provisional claim versus separable partial results
      routing_question: Is there one coherent usable claim under unresolved limits, or different outcomes across separable parts?
      canonical_candidate_handoffs:
        - admissible_but_provisional
        - partially_admissible
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: general uncertainty must not be encoded as partial admissibility
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: resolution_neutral_vs_unsupported_refinement
      confusion: valid resolution neutrality versus unsupported refinement
      routing_question: Did a source-supported resolution test occur and leave the warranted reconstruction unchanged?
      canonical_candidate_handoffs:
        - resolution_neutral
        - failed_transformation
        - mandatory_stop
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: absence of gain or unsupported detail must not automatically become resolution_neutral
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: analogy_vs_projection
      confusion: analogy versus projection
      routing_question: Is only a bounded resemblance retained, or is a source-traceable contextual target function established?
      canonical_candidate_handoffs:
        - analogy_only
        - admissible
        - admissible_with_bounded_claim
        - failed_transformation
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: analogy must not validate PROJECT_AS
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: label_substitution_vs_project_as
      confusion: label substitution versus valid PROJECT_AS
      routing_question: Does the target function depend on constitutive source features while origin type is preserved?
      canonical_candidate_handoffs:
        - failed_transformation
        - admissible
        - admissible_with_bounded_claim
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: renaming must not be treated as projection
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: failure_vs_mandatory_continuation_stop
      confusion: operation failure versus mandatory continuation stop
      routing_question: Has the attempted operation already failed, or would further continuation cross a boundary while prior results may 
        remain?
      canonical_candidate_handoffs:
        - failed_transformation
        - mandatory_stop
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: failure and stop must not be selected by lexical cues
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: mandatory_stop_vs_non_capture
      confusion: mandatory stop versus non-capture
      routing_question: Is the primary result inadmissible continuation or unavailability of any adequate retained claim?
      canonical_candidate_handoffs:
        - mandatory_stop
        - non_capture
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: stop does not prove non-capture
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: failure_vs_non_capture
      confusion: operation failure versus non-capture
      routing_question: Did one operation fail, or does no adequate retained reconstruction remain after bounded alternatives?
      canonical_candidate_handoffs:
        - failed_transformation
        - non_capture
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: one failed operation does not prove uncapturability
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: claim_reduction_vs_tested_bounded_claim
      confusion: claim reduction versus already-tested bounded admissibility
      routing_question: Has the narrower claim already been revised and tested?
      canonical_candidate_handoffs:
        - claim_reduction_required
        - admissible_with_bounded_claim
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: proposed reduction is not already admissible
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: claim_reduction_vs_mandatory_stop
      confusion: claim reduction versus mandatory stop
      routing_question: Can a grounded weaker claim be formulated and retested under current conditions?
      canonical_candidate_handoffs:
        - claim_reduction_required
        - mandatory_stop
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: reduction does not bypass a mandatory continuation boundary
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: decompose_result_vs_source_function_effect
      confusion: DECOMPOSE result versus source-function effect
      routing_question: Is the finding about the decomposition operation, the source function, or the prior source claim?
      canonical_candidate_handoffs:
        - admissible
        - admissible_with_bounded_claim
        - admissible_but_provisional
        - resolution_neutral
        - partially_admissible
        - claim_reduction_required
        - mandatory_stop
        - failed_transformation
        - non_capture
      process_handoffs:
        - claim_and_record_separation
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_claim_segmentation
      noncanonical_branch_effect: retain source-function effect and prior source-claim result as separate axes without automatic class 
        candidacy
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: source-function effect must not automatically classify the DECOMPOSE occurrence
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: partial_capture_vs_whole_claim_non_capture
      confusion: partial capture versus whole-claim non-capture
      routing_question: Does an adequate claim remain for the same delimited whole claim, or only for a separately delimited part?
      canonical_candidate_handoffs:
        - partially_admissible
        - non_capture
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_unresolved_collision
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: partial capture elsewhere does not block whole-claim non_capture
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: optional_stop_vs_mandatory_stop
      confusion: optional Stop versus mandatory_stop
      routing_question: Is continuation merely unnecessary, or inadmissible under present conditions?
      canonical_candidate_handoffs:
        - mandatory_stop
      process_handoffs:
        - candidate_generation
      formal_diagnostic_handoffs: []
      noncanonical_branch_effect: preserve optional Stop as a method finding and determine the class from remaining findings
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: optional Stop creates no canonical class
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: workflow_blockage_vs_methodological_stop
      confusion: workflow blockage versus methodological Stop
      routing_question: Is there a substantive STRATA boundary or only missing workflow completion?
      canonical_candidate_handoffs:
        - mandatory_stop
      process_handoffs: []
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_incomplete_packet
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: workflow blockage must remain a formal diagnostic rather than a class
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: missing_information_vs_non_capture
      confusion: missing information versus Non-Capture
      routing_question: Has bounded assessment shown no adequate retained claim, rather than merely unavailable information?
      canonical_candidate_handoffs:
        - admissible_but_provisional
        - claim_reduction_required
        - mandatory_stop
        - failed_transformation
        - non_capture
      process_handoffs:
        - claim_and_record_separation_or_collision_adjudication
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_incomplete_packet
        - formal_routing_diagnostic_unresolved_selection
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: missing information is not a mechanical non_capture trigger
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
    - confusion_route_id: route_selection_vs_operation_selection
      confusion: route selection versus operation selection
      routing_question: Has the operation already been identified independently before output mapping?
      canonical_candidate_handoffs: []
      process_handoffs:
        - candidate_generation
      formal_diagnostic_handoffs:
        - formal_routing_diagnostic_incomplete_packet
      required_action: apply full cross-rule pattern, split claims where necessary, and use controlled boundary questions before final 
        selection
      prohibited_shortcut: the Decision Tree must not choose or invent an operation
      inventory_role: minimum_open_confusion_route
      substantive_judgment_required: true
