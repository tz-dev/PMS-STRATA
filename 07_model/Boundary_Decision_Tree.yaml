artifact:
  id: pms_strata_boundary_decision_tree
  title: PMS-STRATA Boundary Decision Tree
  version: 0.2.0
  status: active_formal_model
  artifact_role: Machine-readable post-audit routing graph for candidate generation, claim and record separation, controlled class-collision
    adjudication, and unique canonical Output Class selection.
  registered_scope:
    - route selection after the integrated twelve-stage audit
    - class-candidate generation from the full applicable cross-rule pattern
    - claim and record separation before class selection
    - controlled collision adjudication between plausible canonical classes
    - confusion routing and operation-specific routing overlays
    - unique class selection per delimited tested claim or operation occurrence
    - preservation of non-selected material findings and earlier results
    - formal-model and authority safeguards
    - Chapter 8 prose-owned foundational non-equivalence handoff without automatic semantic inference or route selection
  governing_authority_sources:
    - path: PMS.yaml
      role: unchanged external PMS Base dependency
  governing_repository_controls:
    - path: 00_source/PMS-STRATA_Structure.md
      role: architecture and chapter blueprint
    - path: 05_minified/PMS_STRATA_Claim_Boundary_Minified.md
      role: claim and authority boundary control
    - path: 05_minified/PMS_STRATA_Admissibility_Band_Minified.md
      role: post-audit output and boundary routing control
    - path: 05_minified/PMS_STRATA_Minified_Canonical.md
      role: canonical operation, class, Stop, Non-Capture, and chain controls
    - path: 05_minified/PMS_STRATA_Operation_Signatures_Minified.md
      role: operation-local routing and confusion control
    - path: 05_minified/Block_Contracts.md
      role: block-level control contract
    - path: 05_minified/Chapter_Contracts.md
      role: chapter-level control contract
  existing_formal_inputs:
    - path: 07_model/Operation_Registry.yaml
      role: owns operation identity, signatures, and check applicability
    - path: 07_model/Output_Classes.yaml
      role: owns canonical class identity, meaning, and semantic class boundaries
    - path: 07_model/Admissibility_Rules.yaml
      role: owns rule semantics, controlled local findings, and the twelve-stage audit handoff
  supporting_reference_inputs:
    - path: 04_reference/Output_Class_Index.md
      role: class collision and result separation support without independent theory authority
    - path: 04_reference/Admissibility_Band_Reference.md
      role: synchronized twelve-stage audit and post-audit routing support without independent theory authority
    - path: 04_reference/Audit_Checklist.md
      role: audit and output-mapping separation support without independent theory authority
    - path: 04_reference/Transformation_Operation_Index.md
      role: operation-local routing support without independent theory authority
    - path: 04_reference/Non_Equivalence_Index.md
      role: confusion and non-equivalence support without independent theory authority
    - path: 04_reference/Claim_Type_Table.md
      role: claim, support, status, and disposition separation support without independent theory authority
    - path: 04_reference/Evidence_Map.md
      role: source and support handoff support without independent theory authority
    - path: 04_reference/Cross_Reference_Map.md
      role: cross-artifact navigation support without independent theory authority
  prose_precedence: This routing artifact mirrors and tests the active controlled prose. It does not replace PMS Base, canonical corpus 
    prose, binding compact controls, or substantive human and domain-grounded judgment.
  non_authority_statement: Routing consistency, candidate generation, collision completion, unique enum selection, YAML validity, schema 
    validity, or record completeness do not establish empirical truth, causality, semantic or normative validity, legitimacy, diagnosis, 
    application authority, or completeness of capture.
routing_constraints:
  operation_inventory:
    exact_count: 3
    values:
      - COMPOSE
      - DECOMPOSE
      - PROJECT_AS
    owner: 07_model/Operation_Registry.yaml
  canonical_output_class_inventory:
    exact_count: 10
    values:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
      - analogy_only
      - partially_admissible
      - claim_reduction_required
      - mandatory_stop
      - failed_transformation
      - non_capture
    owner: 07_model/Output_Classes.yaml
  admissibility_rule_inventory:
    exact_count: 16
    values:
      - praxis_purchase
      - traceable_load
      - type_integrity
      - reference_continuity
      - functional_continuity
      - temporal_continuity
      - contextual_boundedness
      - counterfactual_sensitivity
      - source_ceiling
      - calibration
      - selection_and_loss
      - alternatives
      - claim_ceiling
      - authority_ceiling
      - stop
      - non_capture
    owner: 07_model/Admissibility_Rules.yaml
  canonical_loss_field_inventory:
    exact_count: 5
    values:
      - preserved
      - compressed
      - excluded
      - uncertain
      - irrecoverable
    owner: 07_model/Operation_Registry.yaml
  integrated_audit_stage_inventory:
    exact_count: 12
    values:
      - source_and_claim_entry
      - operation_classification
      - relevance_floor
      - traceability_ceiling
      - continuity_and_type_integrity
      - counterfactual_sensitivity
      - loss_and_selection
      - alternatives
      - source_and_calibration_limits
      - anti_immunization
      - stop_and_non_capture
      - claim_and_authority_ceiling
    owner: 07_model/Admissibility_Rules.yaml
  current_load_bearing_boundary_inventory:
    exact_count: 14
    values:
      - admissible_vs_bounded_claim
      - bounded_claim_vs_provisional
      - bounded_claim_vs_partial
      - partial_vs_provisional
      - provisional_vs_resolution_neutral
      - provisional_vs_non_capture
      - partial_vs_non_capture
      - claim_reduction_vs_bounded_claim
      - claim_reduction_vs_mandatory_stop
      - mandatory_stop_vs_failed_transformation
      - failed_transformation_vs_non_capture
      - mandatory_stop_vs_non_capture
      - resolution_neutral_vs_claim_reduction
      - analogy_only_vs_failed_projection
    inventory_closed: false
    owner: 07_model/Output_Classes.yaml
  route_selection_owner: 07_model/Boundary_Decision_Tree.yaml
  operation_selection_owner: 07_model/Operation_Registry.yaml
  class_identity_and_meaning_owner: 07_model/Output_Classes.yaml
  rule_semantics_owner: 07_model/Admissibility_Rules.yaml
  record_field_syntax_owner: 07_model/Transformation_Record.schema.json
  output_mapping_is_not_audit_stage_13: true
  first_match_wins: false
  class_ranking: prohibited
  score_based_selection: prohibited
  weight_based_selection: prohibited
  threshold_sum: prohibited
  default_precedence_across_classes: none
  branch_order_is_evaluative_not_rank: true
  primary_governance_question_required: true
  one_rule_finding_never_selects_final_class: true
  full_applicable_cross_rule_pattern_required: true
  exactly_one_class_per_delimited_tested_claim: true
  class_stacking_for_one_undifferentiated_claim: prohibited
  formal_incompleteness_not_canonical_output: true
  authority_inheritance: prohibited
  fourth_operation_prohibited: true
  eleventh_output_class_prohibited: true
input_contract:
  semantic_packet_owner: 07_model/Boundary_Decision_Tree.yaml
  concrete_field_syntax_owner: 07_model/Transformation_Record.schema.json
  required_for_routing:
    - delimited tested claim or operation occurrence
    - registered operation type
    - operation-specific result
    - completed applicable twelve-stage audit pattern or explicit incompleteness diagnostic
    - applicable rule findings
    - audit-to-routing basis
    - rule- and finding-specific rationales
    - controlled local results where corresponding conditions are reached
    - claim scope and validity scope
    - support and calibration limits
    - stop assessment
    - non-capture assessment
    - five-field loss statement
    - alternatives and rivals
  required_where_present_or_applicable:
    - prior failures, limits, reductions, and stops
    - DECOMPOSE source-function effect
    - prior source-claim result
    - separately retained analogy claim
    - chain-local occurrence results
    - re-entry grounds and changed condition
    - prior claim disposition where already present
  missing_required_input_action: emit_noncanonical_formal_routing_diagnostic_without_class_selection
  missing_input_must_not_route_to:
    - failed_transformation
    - mandatory_stop
    - non_capture
  semantic_packet_completeness_not_substantive_validity: true
  produced_during_final_selection:
    - final class-selection rationale
    - current tested-claim disposition
  output_class_not_automatic_claim_disposition: true
  current_claim_disposition_requires_independent_rationale: true
routing_readiness:
  final_route_requires:
    - one delimited tested claim or operation occurrence
    - one registered operation identity
    - available full applicable audit pattern
    - required rule findings and triggered payloads
    - available ten-class inventory
    - available audit-to-routing basis and rule- or finding-specific rationales
    - candidate rationale produced during candidate generation
    - final class-selection rationale and current tested-claim disposition produced during final selection
  routing_entry_must_not_require_downstream_selection_outputs: true
  formal_routing_diagnostics:
    canonical_output: false
    pseudo_class: false
    diagnostic_ids:
      - incomplete_packet
      - unresolved_claim_segmentation
      - no_supported_candidate
      - unresolved_collision
      - unresolved_selection
    diagnostic_node_map:
      incomplete_packet: formal_routing_diagnostic_incomplete_packet
      unresolved_claim_segmentation: formal_routing_diagnostic_unresolved_claim_segmentation
      no_supported_candidate: formal_routing_diagnostic_no_supported_candidate
      unresolved_collision: formal_routing_diagnostic_unresolved_collision
      unresolved_selection: formal_routing_diagnostic_unresolved_selection
    diagnostic_inventory_closed: false
    must_preserve_available_material: true
candidate_generation_contract:
  phase: 2
  candidate_generation_may_return_multiple_candidates: true
  candidate_generation_not_final_selection: true
  candidate_set_not_class_stack: true
  class_specific_constitutive_conditions_required: true
  generic_check_limitation_does_not_license_specialized_class: true
  ordinary_contextual_boundedness_does_not_automatically_generate_bounded_claim_class: true
  resolution_neutral_requires_valid_supported_resolution_test: true
  analogy_only_requires_separately_delimited_affirmative_analogy_claim: true
  claim_reduction_does_not_pre_authorize_reduced_claim: true
  non_capture_not_mechanical_missing_data_result: true
  candidate_profiles:
    admissible:
      candidate_id: candidate_admissible
      canonical_class: admissible
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Does the tested claim pass as declared without a material output-relevant restriction beyond ordinary 
        boundedness?
      routing_discriminators:
        - the delimited tested claim passes all applicable common and operation-specific requirements
        - ordinary required boundedness is declared but no further output-relevant restriction is decisive
        - no material scope reduction, provisional condition, partial split, claim reduction, mandatory stop, operation failure, or capture 
          boundary is the primary governance result
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - admissible_vs_bounded_claim
    admissible_with_bounded_claim:
      candidate_id: candidate_admissible_with_bounded_claim
      canonical_class: admissible_with_bounded_claim
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Is a material restriction of reach or scope itself the decisive result for an already revised and tested 
        claim?
      routing_discriminators:
        - a material restriction of reach or scope is the decisive governance result
        - the narrower claim has already been formulated, substantively tested, and passed
        - the retained scope and excluded reach are both declared
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - admissible_vs_bounded_claim
        - bounded_claim_vs_provisional
        - bounded_claim_vs_partial
        - claim_reduction_vs_bounded_claim
    admissible_but_provisional:
      candidate_id: candidate_admissible_but_provisional
      canonical_class: admissible_but_provisional
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Does one coherent delimited claim remain usable while a material support or calibration limitation 
        remains?
      routing_discriminators:
        - one coherent delimited claim remains usable
        - a material support, calibration, temporal, counterfactual, or rival-reconstruction limit remains unresolved
        - the unresolved limit is not merely editorial and does not eliminate every adequate retained claim
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - bounded_claim_vs_provisional
        - partial_vs_provisional
        - provisional_vs_non_capture
        - provisional_vs_resolution_neutral
    resolution_neutral:
      candidate_id: candidate_resolution_neutral
      canonical_class: resolution_neutral
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Did a source-supported resolution test occur without changing the warranted reconstruction?
      routing_discriminators:
        - a genuine source-supported finer-resolution or granularity comparison occurred
        - the added distinctions do not change the warranted reconstruction
        - the result is not generic absence of findings, unsupported refinement, operation failure, or non-capture
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - resolution_neutral_vs_claim_reduction
        - provisional_vs_resolution_neutral
    analogy_only:
      candidate_id: candidate_analogy_only
      canonical_class: analogy_only
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Does a bounded resemblance remain useful while a valid functional projection or semantic preservation is 
        not established?
      routing_discriminators:
        - a useful bounded resemblance is affirmatively retained as an analogy claim
        - semantic preservation or a source-traceable contextual target function is not established
        - the analogy is separately delimited from any failed PROJECT_AS claim and is not label substitution
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - analogy_only_vs_failed_projection
    partially_admissible:
      candidate_id: candidate_partially_admissible
      canonical_class: partially_admissible
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Can the retained and non-retained parts be explicitly separated and independently traced?
      routing_discriminators:
        - specified separable parts, stages, relations, or subclaims receive different outcomes
        - retained parts remain independently traceable and supportable
        - separation rather than averaging or class stacking preserves the differing results
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - bounded_claim_vs_partial
        - partial_vs_provisional
        - partial_vs_non_capture
    claim_reduction_required:
      candidate_id: candidate_claim_reduction_required
      canonical_class: claim_reduction_required
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Must the present claim be weakened before any retained result can be tested?
      routing_discriminators:
        - the currently tested claim is too strong
        - a concrete source- or rule-grounded weaker formulation warrants explicit reformulation and retesting
        - the weaker formulation has not already been substantively tested or pre-authorized as admissible
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - claim_reduction_vs_bounded_claim
        - resolution_neutral_vs_claim_reduction
        - claim_reduction_vs_mandatory_stop
    mandatory_stop:
      candidate_id: candidate_mandatory_stop
      canonical_class: mandatory_stop
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Would further continuation under the present conditions cross a mandatory boundary?
      routing_discriminators:
        - continuation of the present operation under present conditions would cross a load-bearing STRATA boundary
        - inadmissible continuation is the primary governance result for the current claim or stage
        - the stop preserves prior valid findings and allows re-entry only under changed grounds
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - mandatory_stop_vs_failed_transformation
        - mandatory_stop_vs_non_capture
        - claim_reduction_vs_mandatory_stop
    failed_transformation:
      candidate_id: candidate_failed_transformation
      canonical_class: failed_transformation
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Did the declared operation fail its identity or necessary conditions for the tested claim?
      routing_discriminators:
        - the declared operation fails its identity or one or more necessary conditions
        - operation failure, rather than merely unresolved support or inadmissible future continuation, is the primary result
        - the failure is limited to the tested operation claim and does not automatically invalidate the source object or separate claims
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - mandatory_stop_vs_failed_transformation
        - failed_transformation_vs_non_capture
        - analogy_only_vs_failed_projection
    non_capture:
      candidate_id: candidate_non_capture
      canonical_class: non_capture
      class_definition_owner: 07_model/Output_Classes.yaml
      primary_governance_question: Does no adequate retained STRATA claim remain under the present limiting conditions without distortion or
        false closure?
      routing_discriminators:
        - after bounded tests and alternatives no adequate retained claim remains for the same delimited tested claim
        - retention would require distortion, unsupported extension, destruction of a constitutive feature, or false closure
        - the result is not mechanically inferred from missing fields, missing sources, unknown events, unavailable counterfactuals, or one 
          failed operation
      constitutive_conditions_must_be_checked_against_output_classes: true
      candidate_generation_effect: mark_as_plausible_candidate_only
      candidate_generation_not_final_selection: true
      generic_rule_limitation_not_sufficient: true
      substantive_judgment_required: true
      boundary_handoffs:
        - provisional_vs_non_capture
        - partial_vs_non_capture
        - failed_transformation_vs_non_capture
        - mandatory_stop_vs_non_capture
claim_and_record_separation_contract:
  separation_precedes_collision_selection: true
  exactly_one_class_per_delimited_claim_or_occurrence: true
  multiple_classes_per_case_permitted_only_for_separate_claims_or_occurrences: true
  mandatory_separation_cases:
    - failed PROJECT_AS claim plus separately retained bounded analogy claim
    - DECOMPOSE operation result plus source-function effect plus prior source-claim result
    - one failed operation occurrence plus a later re-entry or independent operation occurrence
    - different local results across an operation chain
    - whole-claim non_capture plus a distinct partial or analogy claim
    - stop trigger plus non-capture statement where they answer different governance questions
    - any case where one class would conceal a second independently testable result
  same_claim_collision_requires_boundary_adjudication: true
  different_claims_require_separate_record_segments: true
  class_stacking_as_reasoning_substitute: prohibited
  material_findings_must_remain_visible_after_split: true
route_node_contract:
  phases:
    - phase: 1
      phase_id: routing_readiness
      role: delimit the claim or occurrence and verify the semantic routing packet
    - phase: 2
      phase_id: candidate_generation
      role: generate plausible canonical-class candidates without final selection
    - phase: 3
      phase_id: claim_separation_and_collision_adjudication
      role: separate distinct claims and resolve same-claim candidate collisions
    - phase: 4
      phase_id: unique_selection_and_handoff
      role: recheck constitutive conditions, select exactly one class per claim, and preserve non-selected findings
  required_keys_for_nonterminal_nodes:
    - node_id
    - phase
    - node_role
    - question
    - required_inputs
    - class_selection_effect
    - claim_split_check
    - preservation_requirements
    - prohibited_inferences
    - substantive_judgment_required
  handoff_targets_must_resolve_to_registered_node_ids: true
  nonterminal_node_requires_binary_or_outcome_handoff: true
  outcome_handoffs_permitted_for_nonbinary_nodes: true
  terminal_nodes_may_omit_handoffs: true
  node_order_is_evaluative_not_class_rank: true
  candidate_regeneration_requires_changed_routing_basis: true
  unchanged_candidate_loop_prohibited: true
  claim_split_requires_segmentation_node_before_regeneration: true
  confusion_handoffs_are_typed: true
route_nodes:
  - node_id: routing_entry
    phase: 1
    node_role: entry
    question: Is a delimited tested claim or operation occurrence presented for post-audit output mapping?
    required_inputs:
      - tested claim or occurrence pointer
    positive_handoff: packet_completeness_check
    negative_handoff: formal_routing_diagnostic_incomplete_packet
    class_selection_effect: none
    claim_split_check: false
    preservation_requirements:
      - preserve the supplied material without assigning a canonical class
    prohibited_inferences:
      - absence of a delimited claim is not failed_transformation, mandatory_stop, or non_capture
    substantive_judgment_required: false
  - node_id: packet_completeness_check
    phase: 1
    node_role: routing_readiness
    question: Are the operation identity, applicable twelve-stage audit pattern, required triggered payloads, audit-to-routing basis, and 
      rule- or finding-specific rationales available?
    required_inputs:
      - operation type
      - twelve-stage audit pattern
      - applicable rule findings
      - triggered local-result payloads where applicable
      - audit-to-routing basis
      - rule- and finding-specific rationales
    positive_handoff: claim_delimitation_and_axis_check
    negative_handoff: formal_routing_diagnostic_incomplete_packet
    class_selection_effect: none
    claim_split_check: false
    preservation_requirements:
      - preserve available findings and list missing routing inputs
    prohibited_inferences:
      - formal incompleteness does not itself establish any canonical class
    substantive_judgment_required: false
  - node_id: claim_delimitation_and_axis_check
    phase: 1
    node_role: claim_axis_control
    question: Are the tested claim, operation occurrence, operation-specific result, and any separate result axes clearly delimited?
    required_inputs:
      - claim scope and validity scope
      - operation occurrence
      - operation-specific result
      - separate axes where applicable
    positive_handoff: candidate_generation
    negative_handoff: claim_and_record_separation
    class_selection_effect: none
    claim_split_check: true
    preservation_requirements:
      - preserve DECOMPOSE source-function effects, prior source-claim results, analogy claims, and chain-local outputs as separate axes 
        where present
    prohibited_inferences:
      - different result axes must not be collapsed into one class
    substantive_judgment_required: true
  - node_id: candidate_generation
    phase: 2
    node_role: candidate_generation
    question: Which canonical classes remain plausible after considering the full applicable cross-rule pattern and class-specific 
      constitutive conditions?
    required_inputs:
      - full cross-rule pattern
      - controlled local results where triggered
      - support and calibration limits
      - stop assessment
      - non-capture assessment
      - loss and alternatives
    positive_handoff: candidate_multiplicity_check
    negative_handoff: formal_routing_diagnostic_no_supported_candidate
    class_selection_effect: generate_zero_one_or_multiple_candidates_without_selection
    claim_split_check: false
    preservation_requirements:
      - retain every candidate rationale and every material noncandidate finding
    prohibited_inferences:
      - one local rule finding is never sufficient
      - candidate generation is not final route selection
    substantive_judgment_required: true
  - node_id: candidate_multiplicity_check
    phase: 3
    node_role: candidate_control
    question: How many plausible candidates remain, and do multiple candidates concern the same delimited claim?
    required_inputs:
      - candidate set
      - claim pointers for each candidate
    outcome_handoffs:
      zero_candidates: formal_routing_diagnostic_no_supported_candidate
      one_candidate: unique_candidate_constitutive_recheck
      multiple_candidates_same_claim: claim_and_record_separation_or_collision_adjudication
      multiple_candidates_distinct_claims: claim_and_record_separation
    class_selection_effect: none
    claim_split_check: true
    preservation_requirements:
      - preserve every candidate and its claim pointer independently
    prohibited_inferences:
      - multiple candidates do not authorize class stacking
      - one candidate is not proof of substantive correctness
    substantive_judgment_required: true
  - node_id: claim_and_record_separation_or_collision_adjudication
    phase: 3
    node_role: separation_and_collision
    question: Must the candidates be separated into distinct claims or record segments, or do they require a controlled same-claim collision
      boundary?
    required_inputs:
      - candidate claims
      - fourteen controlled boundary identifiers
      - material findings supporting each candidate
    outcome_handoffs:
      separate_claims_or_occurrences: claim_and_record_separation
      same_claim_controlled_collision: collision_boundary_adjudication_or_split
      one_candidate_after_axis_correction: unique_candidate_constitutive_recheck
      unresolved: formal_routing_diagnostic_unresolved_collision
    class_selection_effect: none
    claim_split_check: true
    preservation_requirements:
      - preserve both material conditions and the reason for split or same-claim treatment
    prohibited_inferences:
      - branch order does not create class precedence
      - lexical cues do not select a class
    substantive_judgment_required: true
  - node_id: unique_candidate_constitutive_recheck
    phase: 4
    node_role: preselection_recheck
    question: Does the sole candidate satisfy its class-specific constitutive conditions and remain consistent with every load-bearing 
      finding?
    required_inputs:
      - sole candidate
      - class-specific conditions
      - full cross-rule pattern
      - non-compensation check
    outcome_handoffs:
      candidate_confirmed: unique_class_selection
      candidate_rejected_alternatives_remain: candidate_generation
      candidate_rejected_no_candidate_remains: formal_routing_diagnostic_no_supported_candidate
      unresolved_packet_contradiction: formal_routing_diagnostic_unresolved_selection
    class_selection_effect: none_until_recheck_passes
    claim_split_check: false
    preservation_requirements:
      - preserve the rejected candidate and reason if recheck fails
    prohibited_inferences:
      - sole candidate status is not proof of substantive correctness
    substantive_judgment_required: true
    candidate_regeneration_requires_changed_routing_basis: true
    unchanged_candidate_loop_prohibited: true
    regeneration_basis_may_change_through:
      - candidate set
      - claim segmentation
      - boundary adjudication
      - routing evidence or rationale
  - node_id: unique_class_selection
    phase: 4
    node_role: final_selection
    question: Can exactly one canonical class be selected for this delimited claim with a reasoned route and all non-selected findings 
      preserved?
    required_inputs:
      - selected class candidate
      - matched constitutive conditions
      - controlling boundary identifiers where applicable
      - rejected candidates and reasons
      - preserved findings
      - candidate and boundary rationales
    produced_outputs:
      - final class-selection rationale
      - current tested-claim disposition
    positive_handoff: final_record_handoff
    negative_handoff: formal_routing_diagnostic_unresolved_selection
    class_selection_effect: select_exactly_one_canonical_class_for_delimited_claim
    claim_split_check: true
    preservation_requirements:
      - retain operation-specific result, rule findings, support limits, loss, stop and capture findings, prior results, and chain-local 
        outputs
    prohibited_inferences:
      - selected class is not a truth value, score, rank, or application authorization
      - Output Class does not automatically determine current tested-claim disposition
    substantive_judgment_required: true
    output_class_not_automatic_claim_disposition: true
    current_claim_disposition_requires_independent_rationale: true
  - node_id: claim_and_record_separation
    phase: 3
    node_role: claim_segmentation
    question: Can materially distinct findings be delimited as separate claims, subclaims, stages, record segments, or operation 
      occurrences?
    required_inputs:
      - material findings
      - claim and occurrence pointers
      - reason separation is required
    positive_handoff: candidate_generation
    negative_handoff: formal_routing_diagnostic_unresolved_claim_segmentation
    class_selection_effect: restart_candidate_generation_for_each_separated_claim_or_occurrence
    claim_split_check: true
    preservation_requirements:
      - preserve all original findings and their relation to the broader case
    prohibited_inferences:
      - claim splitting must not erase the broader failed, stopped, reduced, or non-captured claim
    substantive_judgment_required: true
    segmentation_outputs_required_before_positive_handoff:
      - separate claim, subclaim, stage, record-segment, or occurrence pointers
      - finding allocation for each separated packet
      - preserved relation to the broader case
    candidate_regeneration_basis_changed_by_segmentation: true
  - node_id: collision_boundary_adjudication_or_split
    phase: 3
    node_role: controlled_collision_resolution
    question: Does a current controlled boundary question resolve the same-claim collision, or must independently testable findings be 
      split?
    required_inputs:
      - candidate set
      - same-claim determination
      - controlling boundary question
      - material conditions for every candidate
    outcome_handoffs:
      resolved_same_claim_collision: unique_candidate_constitutive_recheck
      split_required: claim_and_record_separation
      unresolved: formal_routing_diagnostic_unresolved_collision
    class_selection_effect: resolve_same_claim_candidate_or_require_segmentation_before_regeneration
    claim_split_check: true
    preservation_requirements:
      - preserve both material conditions, the controlling boundary, and any rejected candidate rationale
    prohibited_inferences:
      - no unlisted lexical or ordinal precedence may resolve the collision
    substantive_judgment_required: true
  - node_id: final_record_handoff
    phase: 4
    node_role: terminal_success
    question: Has the selected class and full preservation payload been handed off for record-schema encoding?
    required_inputs:
      - selected canonical class
      - final class-selection rationale
      - current tested-claim disposition
      - preserved findings
      - claim split status
    class_selection_effect: terminal_selected_route_handoff
    claim_split_check: false
    preservation_requirements:
      - all required semantic handoffs remain available to Transformation_Record.schema.json
    prohibited_inferences:
      - record-schema acceptance does not establish substantive correctness
      - Output Class does not automatically determine current tested-claim disposition
    substantive_judgment_required: false
    output_class_not_automatic_claim_disposition: true
  - node_id: formal_routing_diagnostic_incomplete_packet
    phase: 1
    node_role: terminal_formal_diagnostic
    question: Which required routing inputs are absent or structurally incomplete?
    required_inputs:
      - available partial packet
      - missing-input list
    class_selection_effect: none
    claim_split_check: false
    preservation_requirements:
      - preserve all available material and missing-input diagnostics
    prohibited_inferences:
      - formal incompleteness is not a canonical output
    substantive_judgment_required: false
  - node_id: formal_routing_diagnostic_unresolved_claim_segmentation
    phase: 3
    node_role: terminal_formal_diagnostic
    question: Why can the material findings not yet be assigned to delimited claims or occurrences?
    required_inputs:
      - unresolved segmentation rationale
    class_selection_effect: none
    claim_split_check: true
    preservation_requirements:
      - preserve every unresolved finding without class stacking
    prohibited_inferences:
      - unresolved segmentation is not failed_transformation, mandatory_stop, or non_capture
    substantive_judgment_required: false
  - node_id: formal_routing_diagnostic_no_supported_candidate
    phase: 2
    node_role: terminal_formal_diagnostic
    question: Why does the present routing packet fail to support any class candidate?
    required_inputs:
      - candidate-generation rationale
      - unsupported or missing constitutive conditions
    class_selection_effect: none
    claim_split_check: false
    preservation_requirements:
      - preserve all findings and candidate rejections
    prohibited_inferences:
      - absence of a supported candidate is not automatically non_capture or failed_transformation
    substantive_judgment_required: false
  - node_id: formal_routing_diagnostic_unresolved_collision
    phase: 3
    node_role: terminal_formal_diagnostic
    question: Which same-claim collision or separation question remains unresolved?
    required_inputs:
      - candidate set
      - attempted boundary adjudication
      - unresolved reason
    class_selection_effect: none
    claim_split_check: true
    preservation_requirements:
      - preserve all candidates and material conditions
    prohibited_inferences:
      - unresolved collision must not be silently defaulted
    substantive_judgment_required: false
  - node_id: formal_routing_diagnostic_unresolved_selection
    phase: 4
    node_role: terminal_formal_diagnostic
    question: Why can exactly one canonical class not yet be selected for the delimited claim?
    required_inputs:
      - remaining candidates
      - failed constitutive rechecks or missing rationale
    class_selection_effect: none
    claim_split_check: true
    preservation_requirements:
      - preserve candidates, findings, and unresolved rationale
    prohibited_inferences:
      - unresolved selection is not a pseudo-class
    substantive_judgment_required: false
class_collision_contract:
  boundary_inventory_closed: false
  boundary_entries_are_current_load_bearing_set: true
  exact_boundary_count: 14
  first_match_wins: false
  class_ranking: prohibited
  score_based_selection: prohibited
  weight_based_selection: prohibited
  default_precedence_across_classes: none
  same_claim_check_required_before_collision: true
  primary_governance_question_required: true
  preserve_both_material_conditions_in_rationale: true
  split_claims_where_independently_testable: true
  retain_non_selected_method_finding: true
  lexical_selection_prohibited: true
  unregistered_or_new_collision_action: preserve candidates, prohibit default selection, document the unresolved boundary, and emit a formal
    routing diagnostic pending prose-controlled clarification
  new_collision_must_not_be_silently_added_to_closed_inventory: true
  boundary_entries:
    - boundary_id: admissible_vs_bounded_claim
      classes_or_results_distinguished:
        - kind: canonical_class
          id: admissible
        - kind: canonical_class
          id: admissible_with_bounded_claim
      distinguishing_question: Is a material restriction relative to the tested or normally expected claim itself the decisive governance 
        result?
      semantic_rule:
        - ordinary required contextual boundedness with no further output-relevant narrowing -> admissible
        - material narrowing of reach or scope as the decisive result for an already tested claim -> admissible_with_bounded_claim
      no_default_precedence: true
      route_owner: 07_model/Boundary_Decision_Tree.yaml
      boundary_definition_owner: 07_model/Output_Classes.yaml
      routing_owner: 07_model/Boundary_Decision_Tree.yaml
      same_delimited_claim_check_required: true
      different_claims_or_stages_action: separate_claims_or_record_segments_before_class_selection
      primary_governance_question_controls_selection: true
      preserve_non_selected_material_condition: true
      lexical_selection_prohibited: true
      substantive_judgment_required: true
      claim_split_required_when_both_results_are_independently_testable: true
      routing_effect:
        - ordinary required contextual boundedness with no further output-relevant narrowing -> admissible
        - material narrowing of reach or scope as the decisive result for an already tested claim -> admissible_with_bounded_claim
    - boundary_id: bounded_claim_vs_provisional
      classes_or_results_distinguished:
        - kind: canonical_class
          id: admissible_with_bounded_claim
        - kind: canonical_class
          id: admissible_but_provisional
      distinguishing_question: Is the primary result a material scope restriction or a material unresolved support or calibration condition 
        within one coherent scope?
      semantic_rule:
        - already revised and tested narrower reach as primary issue -> admissible_with_bounded_claim
        - one coherent claim remains usable but support, calibration, temporal, counterfactual, or rival stability remains material -> 
          admissible_but_provisional
        - where both matter, state both conditions separately and select the class representing the primary governance result for the 
          delimited claim
      no_default_precedence: true
      route_owner: 07_model/Boundary_Decision_Tree.yaml
      boundary_definition_owner: 07_model/Output_Classes.yaml
      routing_owner: 07_model/Boundary_Decision_Tree.yaml
      same_delimited_claim_check_required: true
