      distinguishing_question: Has the narrower claim already been revised and tested, or must the current claim still be weakened?
      semantic_rule:
        - current claim must still be weakened and retested -> claim_reduction_required
        - narrower claim has already been revised, tested, and passed -> admissible_with_bounded_claim
