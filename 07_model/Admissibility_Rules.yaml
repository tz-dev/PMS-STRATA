    prohibited_inferences_are_minimum_not_exhaustive: true
  claim_ceiling:
    rule_id: claim_ceiling
    canonical_name: ClaimCeiling
    rule_role: Maximum warranted claim-strength check
    governing_question: Does the assertion remain within the maximum warranted relation, reach, precision, generality,
      functional scope, and dependence strength?
    positive_burden:
    - integrate source support, operation identity, integrity, continuity, context, sensitivity, calibration, loss,
      and alternatives
    - state the maximum retained claim
    valid_bounded_negative_or_unavailable_result:
    - the current claim may require a concrete weaker formulation and new test
    - identifying a weaker claim does not pre-authorize it
    failure_signals:
    - unsupported reach or precision
    - stronger dependence than the source trace carries
    - Output Class used to raise the ceiling
    failure_signals_closed: false
    claim_effect_families:
    - retain
    - bound
    - qualify
    - reduce
    - withdraw
    - mark_capture_limit
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: null
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates
      for failure or limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
      - applicability and rationale where conditional
      - control-source pointer
      - evidence or artifact pointer
      - reasoned finding
      - claim or artifact effect
      - required action
      - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
    - admissible
    - admissible_with_bounded_claim
    - admissible_but_provisional
    - resolution_neutral
    - analogy_only
    - partially_admissible
    - claim_reduction_required
    - mandatory_stop
    - failed_transformation
    - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
    - claim dimensions and maximum retained claim are declared
    - weaker claim is marked for retesting rather than pre-authorized
    substantive_judgment_required:
    - whether the maximum claim is warranted by the combined rule pattern
    - whether a weaker formulation has sufficient grounds for retesting
    critical_boundaries:
    - Claim Ceiling != Source Ceiling
    - Claim Ceiling != Traceability Ceiling
    - Claim Ceiling != Authority Ceiling
    prohibited_inferences:
    - class label raises claim authority
    - weaker claim is automatically admissible
    prohibited_inferences_are_minimum_not_exhaustive: true
  authority_ceiling:
    rule_id: authority_ceiling
    canonical_name: AuthorityCeiling
    rule_role: Independent hard authority boundary
    governing_question: Does the record prohibit authority inheritance and every authority form STRATA cannot license?
    positive_burden:
    - declare authority_inheritance as prohibited
    - block empirical, causal, diagnostic, normative, legal, political, intervention, sanction, person-ranking,
      and application authority from structural success
    - route external warrant without inheriting STRATA validation
    valid_bounded_negative_or_unavailable_result:
    - external warrant may be required
    - a structurally admissible result remains analytically bounded without application authority
    failure_signals:
    - structural success converted into mandate
    - person typing or diagnosis
    - legitimacy or intervention decision
    - new PMS primitive
    - model superiority inferred from translation success
    failure_signals_closed: false
    claim_effect_families:
    - retain
    - bound
    - qualify
    - withdraw
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: null
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates
      for failure or limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
      - applicability and rationale where conditional
      - control-source pointer
      - evidence or artifact pointer
      - reasoned finding
      - claim or artifact effect
      - required action
      - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
    - admissible
    - admissible_with_bounded_claim
    - admissible_but_provisional
    - resolution_neutral
    - analogy_only
    - partially_admissible
    - claim_reduction_required
    - mandatory_stop
    - failed_transformation
    - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
    - authority_inheritance is prohibited
    - blocked authority forms are explicitly acknowledged
    substantive_judgment_required:
    - whether language or intended use materially crosses the Authority Ceiling
    - which external warrant is required
    critical_boundaries:
    - Authority Ceiling is independent and hard
    - Claim Ceiling satisfied != Authority Ceiling satisfied
    prohibited_inferences:
    - structural admissibility authorizes action
    - machine validation creates legitimacy
    prohibited_inferences_are_minimum_not_exhaustive: true
  stop:
    rule_id: stop
    canonical_name: Stop
    rule_role: Mandatory-versus-optional continuation boundary
    governing_question: Must continuation end, or is further work merely unnecessary?
    positive_burden:
    - define the stop condition for every operation occurrence
    - assess whether the stop condition is reached
    - when stop is reached, distinguish mandatory from optional stop
    - when stop is reached, state preserved results
    - state re-entry conditions when stop is reached or re-entry is contemplated
    valid_bounded_negative_or_unavailable_result:
    - mandatory stop ends inadmissible continuation
    - optional stop preserves a sufficient or neutral result without creating a new Output Class
    failure_signals:
    - continued work below the Relevance Floor
    - lost TraceableLoad
    - Source Ceiling exceeded
    - Type Integrity or reference identity cannot be maintained
    - non-discriminating calibration
    - Authority Ceiling violation
    - anti-immunization rescue
    - continued unsupported or repetitive detail
    failure_signals_closed: false
    claim_effect_families:
    - retain
    - bound
    - qualify
    - withdraw
    - mark_capture_limit
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: stop_mode
    conditional_payload_contract:
      stop_condition_required_for_every_occurrence: true
      stop_mode_required_only_when_stop_is_reached: true
      preserved_result_required_when_stop_is_reached: true
      reentry_conditions_required_when_stop_is_reached_or_reentry_is_contemplated: true
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates
      for failure or limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
      - applicability and rationale where conditional
      - control-source pointer
      - evidence or artifact pointer
      - reasoned finding
      - claim or artifact effect
      - required action
      - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
    - admissible
    - admissible_with_bounded_claim
    - admissible_but_provisional
    - resolution_neutral
    - analogy_only
    - partially_admissible
    - claim_reduction_required
    - mandatory_stop
    - failed_transformation
    - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
    - a stop condition and reached-or-not-reached assessment are present for every occurrence
    - stop mode uses the controlled two-value vocabulary only when stop is reached
    - preserved result is present when stop is reached
    - re-entry conditions are present when stop is reached or re-entry is contemplated
    substantive_judgment_required:
    - whether continuation is inadmissible or merely unnecessary
    - whether a trigger is materially reached
    critical_boundaries:
    - resolution_neutral != automatic mandatory_stop
    - stop trigger != automatic canonical class selection
    - optional stop != eleventh Output Class
    prohibited_inferences:
    - optional stop is an eleventh Output Class
    - neutrality automatically means mandatory stop
    prohibited_inferences_are_minimum_not_exhaustive: true
  non_capture:
    rule_id: non_capture
    canonical_name: NonCapture
    rule_role: Adequate-capture and false-closure boundary
    governing_question: Does an adequate retained claim remain without distortion, unsupported extension, destruction
      of a constitutive feature, or false closure?
    positive_burden:
    - assess whether an adequate retained claim remains for every operation occurrence
    - when partial capture or a capture limit is asserted, state attempted operations
    - when partial capture or a capture limit is asserted, state captured and uncaptured structure
    - when partial capture or a capture limit is asserted, identify the limiting condition
    - when partial capture or a capture limit is asserted, preserve rivals or alternatives
    - when canonical non_capture is under consideration, state claim effect and re-entry condition
    valid_bounded_negative_or_unavailable_result:
    - partial capture may coexist with Whole-Claim Non-Capture
    - a bounded or provisional adequate retained claim may prevent non_capture for that same delimited claim
    - separate analogical or partial claims do not automatically prevent broader Non-Capture
    failure_signals:
    - missing information treated as a result
    - Non-Capture used to shield a weak claim
    - unreasoned semantic exteriority
    - new primitive inferred from remainder
    failure_signals_closed: false
    claim_effect_families:
    - retain
    - separate
    - withdraw
    - mark_capture_limit
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: non_capture_form
    conditional_payload_contract:
      adequate_capture_assessment_required_for_every_occurrence: true
      detailed_capture_boundary_payload_required_only_when:
      - partial capture is asserted
      - a non-capture form is asserted
      - canonical non_capture is under consideration
      ordinary_positive_assessment_may_state:
      - adequate retained claim remains
      - no material capture limit asserted
      no_non_capture_pseudo_value_required: true
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates
      for failure or limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
      - applicability and rationale where conditional
      - control-source pointer
      - evidence or artifact pointer
      - reasoned finding
      - claim or artifact effect
      - required action
      - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
    - admissible
    - admissible_with_bounded_claim
    - admissible_but_provisional
    - resolution_neutral
    - analogy_only
    - partially_admissible
    - claim_reduction_required
    - mandatory_stop
    - failed_transformation
    - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
    - an adequate-capture assessment is present for every occurrence
    - capture and non-capture statements are separated where a capture boundary is asserted
    - attempted operations, captured and uncaptured structure, and limiting condition are recorded only when the
      detailed capture-boundary payload is required
    - partial capture can be represented independently
    - no no_non_capture pseudo-value is required or permitted
    substantive_judgment_required:
    - whether an adequate retained claim remains for the same delimited tested claim
    - whether a constitutive feature is destroyed by capture
    critical_boundaries:
    - Non-Capture concept != non-capture claim != non_capture class
    - partial capture != automatic partially_admissible
    - missing information != Non-Event != Non-Capture
    prohibited_inferences:
    - missing information mechanically establishes Non-Capture
    - remainder authorizes a new primitive
    - Non-Capture immunizes a weak claim
    prohibited_inferences_are_minimum_not_exhaustive: true
non_compensation_contract:
  no_scoring: true
  no_weighting: true
  no_averaging: true
  no_threshold_sum: true
  no_compensation_across_load_bearing_checks: true
  later_success_does_not_erase_earlier_failure_or_limit: true
  formal_completeness_does_not_establish_substantive_passage: true
  examples:
  - high detail cannot compensate for absent PraxisPurchase
  - many citations cannot compensate for absent TraceableLoad
  - strong sources cannot compensate for a type jump
  - traceability cannot compensate for Authority Ceiling failure
  - formal completeness cannot compensate for an unbounded claim
  - Counterfactual Sensitivity cannot become causal proof
  - a successful later operation cannot erase an earlier failed claim
  - a larger composite cannot confer authority
  qualified_result_rule: A failed or limited load-bearing check may contribute to a qualified, reduced, stopped,
    failed, or capture-limited final result, but each canonical class still requires its own class-specific conditions
    and the full cross-rule pattern.
  not_all_checks_positive_does_not_mean_no_legitimate_methodological_result: true
  class_specific_conditions_remain_required: true
  generic_check_limitation_does_not_license_specialized_class: true
claim_reduction_contract:
  role: Rule-level governance relation; not an Output Class definition and not route selection.
  trigger_dimensions:
  - relation
  - reach
  - precision
  - generality
  - functional_scope
  - dependence_strength
  - object_class
  - temporal_scope
  - contextual_scope
  trigger_dimensions_closed: false
  required_conditions:
  - the current claim exceeds a warranted dimension
  - a concrete weaker formulation has identifiable source- or rule-grounded reasons sufficient to justify reformulation
    and retesting
  - the weaker formulation is not pre-authorized as admissible
  - the original stronger claim and its failure or limitation remain recorded
  - the revised claim receives a new or revised test
  separations:
  - claim reduction != support downgrade
  - claim reduction != resolution neutrality
  - claim reduction != source-function effect
  - claim reduction != automatic admissibility of the reduced claim
  compatible_final_output_class: claim_reduction_required
  final_class_compatibility_not_route_selection: true
stop_and_reentry_contract:
  mandatory_stop:
    meaning: Continuation of the current operation or claim would violate a load-bearing gate.
    current_trigger_families:
    - continued work below the Relevance Floor
    - lost TraceableLoad
    - Source Ceiling exceeded
    - Type Integrity or reference identity cannot be maintained
    - non-discriminating calibration
    - Authority Ceiling violation
    - anti-immunization rescue
    - continued unsupported or repetitive detail
    - contextual boundedness cannot be stated
    - a countercase is merely moved to another level, frame, granularity, composition, or target function
    trigger_families_closed: false
  optional_stop:
    meaning: Continuation may remain admissible but is unnecessary for the current claim.
    current_trigger_families:
    - the present claim is already sufficient
    - a neutral comparison establishes no need for further refinement
    - no-transformation is preferable without making continuation inadmissible
    trigger_families_closed: false
    creates_output_class: false
  reentry:
    requires_one_or_more:
    - new source basis
    - materially different claim
    - newly visible counterstructure
    - newly warranted calibration
    - new or materially different distinction or question
    - newly justified granularity
    - restored Source Trace
    - independent new operation and claim
    new_or_revised_record_required: true
    prior_result_preserved: true
    prior_failure_preserved_where_present: true
    unrecorded_continuation_prohibited: true
    reentry_reason_families_closed: false
    reentry_requires_changed_condition: true
  stop_trigger_not_automatic_class_selection: true
  route_selection_owner: 07_model/Boundary_Decision_Tree.yaml
non_capture_contract:
  required_distinctions:
  - capture statement
  - partial capture
  - Non-Capture concept
  - non-capture claim
  - non_capture class
  use_condition: No adequate retained claim remains for the same delimited tested claim without distortion, unsupported
    extension, destruction of a constitutive feature, or false closure.
  required_preservation:
  - captured remainder
  - uncaptured remainder
  - limiting condition
  - attempted transformations
  - rivals or external alternatives
  - re-entry conditions
  - earlier failures and stops where present
  mechanical_triggers_prohibited:
  - missing fields
  - unknown events
  - missing sources
  - unavailable counterfactuals
  partial_capture_may_coexist_with_whole_claim_non_capture: true
  separate_analogy_or_partial_claim_does_not_block_broader_non_capture: true
  adequate_retained_claim_for_same_delimited_claim_blocks_non_capture: true
  compatible_final_output_class: non_capture
  final_class_compatibility_not_route_selection: true
anti_immunization_contract:
  canonical_rule: new transformation = new testable claim
  cross_cutting_not_seventeenth_check: true
  required_conditions:
  - original claim identifier and result remain visible
  - the new operation receives a separate occurrence and claim
  - the original countercase or counterpressure remains preserved where present
  - the new operation can independently fail
  - frame, granularity, level, composition, or target-function change does not repair the earlier claim automatically
  prohibited_rescue_forms:
  - granularity escape
  - higher-level escape
  - projection rescue
  - translation-success validation
  - Non-Capture as immunity
  prohibited_rescue_forms_closed: false
  prior_failure_preserved: true
  prior_limit_preserved: true
  prior_stop_preserved_where_present: true
claim_and_authority_ceiling_contract:
  claim_ceiling:
    dimensions:
    - relation
    - reach
    - precision
    - generality
    - functional_scope
    - dependence_strength
    dimensions_closed: false
    conditioned_by:
    - source support
    - operation identity
    - type and reference integrity
    - continuity
    - context and scope
    - counterfactual load
    - calibration
    - loss
    - alternatives
    numeric_calculation_prohibited: true
    maximum_retained_claim_required: true
  authority_ceiling:
    independent_hard_boundary: true
    authority_inheritance: prohibited
    blocked_authority_forms_minimum:
    - empirical truth authority
    - causal authority
    - diagnostic authority
    - normative authority
    - legal legitimacy authority
    - political legitimacy authority
    - intervention authority
    - sanction authority
    - person-ranking authority
    - application authority
    blocked_authority_forms_inventory_closed: false
    external_warrant_may_be_required: true
    external_warrant_does_not_inherit_strata_validation: true
  claim_ceiling_satisfied_does_not_automatically_satisfy_authority_ceiling: true
operation_specific_rule_overlays:
  overlay_contract:
    operation_identity_owner: 07_model/Operation_Registry.yaml
    overlays_do_not_redefine_operation_signatures: true
    overlays_use_only_common_rule_ids: true
    operation_specific_examples_closed: false
  COMPOSE:
    operation_id: COMPOSE
    rule_emphases:
      praxis_purchase: The result must exceed chronology, aggregation, or narrative grouping.
      traceable_load: Source sequence, relations, transitions, selection, and loss remain reconstructible.
      type_integrity: Component types remain visible and no target function is smuggled into the composite.
      temporal_continuity: Required where temporal formation is constitutive under the Registry applicability condition.
      counterfactual_sensitivity: Changes in order, turning point, Non-Event, selection, or constitutive relation
        can alter the composite.
      stop: Chronology without path gain, source-indifferent macro-label, arbitrary periodization, or hidden loss
        can trigger stop.
  DECOMPOSE:
    operation_id: DECOMPOSE
    rule_emphases:
      praxis_purchase: Added distinction changes or validly tests a warranted reconstruction.
      traceable_load: Finer components reconstruct the same source object and keep the coarser function testable.
      type_integrity: Only an occurrence or composite is opened; the operator type remains intact.
      functional_continuity: Source-function effect is recorded separately and may be confirmed, refined, partially
        preserved, rejected, or underdetermined.
      stop: Further detail below the Floor, beyond the Source Ceiling, after source-object loss, without component
        relations, or through resolution escape can trigger stop.
    resolution_test_result_required: true
    resolution_test_vocabulary: resolution_test_result
    resolution_neutral_not_automatic_mandatory_stop: true
    source_function_effect_does_not_automatically_classify_operation: true
  PROJECT_AS:
    operation_id: PROJECT_AS
    rule_emphases:
      praxis_purchase: The target function adds a bounded contextual function rather than a new label.
      traceable_load: The target function depends on constitutive source features.
      type_integrity: The origin type remains preserved.
      functional_continuity: The target function changes with source load and remains context-bound.
      counterfactual_sensitivity: Materially altered source structure weakens, changes, or removes the target function.
      alternatives: Analogy, recontextualization, label substitution, and no projection remain separately available.
      stop: Source-indifferent function, arbitrary target context, type replacement, or projection/analogy collapse
        can trigger stop.
    analogy_only_possible_without_projection_success: true
    projection_failure_and_retained_analogy_require_separate_claims_or_record_segments: true
chapter_6_admissibility_band_handoff:
  canonical_prose_owner: 01_blocks/01_foundations.md#chapter-6-the-strata-admissibility-band
  status: chapter_6_provisional_lock_mirror
