    universal_composite_maximum_prohibited: true
    universal_level_count_prohibited: true
    universal_recurrence_duration_similarity_thresholds_prohibited: true
    weighted_scoring_and_compensatory_thresholds_prohibited: true
    bounded_local_comparison_allowed: true
