    new_operation_required: false
    new_output_class_required: false
    record_schema_expansion_required: false
    automatic_semantic_admissibility_decision_prohibited: true
    automatic_causal_decision_prohibited: true
    automatic_output_class_selection_prohibited: true
    empirical_truth_not_decidable: true
    semantic_or_normative_validity_not_decidable: true
    complete_capture_not_decidable: true
    authority_not_inherited: true
formal_model_boundary:
  machine_checkable:
  - exactly sixteen rule identifiers exist and match the Operation Registry
