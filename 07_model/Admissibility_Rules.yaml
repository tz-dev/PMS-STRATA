      - gain
      - neutral
      - below_floor
      - underdetermined
    inventory_closed: true
    owner: 07_model/Admissibility_Rules.yaml
    not_canonical_output_class: true
  resolution_test_result:
    values:
      - resolution_gain
      - resolution_neutral
      - resolution_drift
      - resolution_escape
    inventory_closed: true
    owner: 07_model/Admissibility_Rules.yaml
    not_canonical_output_class: true
    separate_from_relevance_floor_boundary_result: true
  traceability_ceiling_boundary_result:
    values:
      - within_ceiling
      - claim_reduction
      - above_ceiling
      - underdetermined
    inventory_closed: true
    owner: 07_model/Admissibility_Rules.yaml
    claim_reduction_value_is_boundary_signal_not_output_class: true
  counterfactual_sensitivity_class:
    values:
      - strongly_sensitive
      - partially_sensitive
      - weakly_sensitive
      - insensitive
      - underdetermined
      - untestable
    inventory_closed: true
    owner: 07_model/Admissibility_Rules.yaml
    not_causal_proof: true
    not_empirical_experiment: true
  calibration_state:
    values:
      - discriminating
      - calibration_open
      - case_dependent
      - non_discriminating
      - not_calibratable_with_present_sources
    inventory_closed: false
    owner: 07_model/Admissibility_Rules.yaml
    extension_requires_controlled_prose: true
  stop_mode:
    values:
      - mandatory
      - optional
    inventory_closed: true
    owner: 07_model/Admissibility_Rules.yaml
    optional_stop_not_output_class: true
    value_required_only_when_stop_is_reached: true
    absence_when_no_stop_is_reached_is_permitted: true
    no_stop_pseudo_value_prohibited: true
  non_capture_form:
    values:
      - source_non_capture
      - granularity_non_capture
      - compositional_non_capture
      - projection_non_capture
      - calibration_non_capture
      - semantic_non_capture
      - partial_capture
    inventory_closed: false
    owner: 07_model/Admissibility_Rules.yaml
    partial_capture_may_coexist_with_whole_claim_non_capture: true
    value_required_only_when_capture_limit_is_asserted: true
    absence_when_no_non_capture_claim_is_made_is_permitted: true
    no_non_capture_pseudo_value_prohibited: true
  claim_effect_family:
    values:
      - retain
      - bound
      - qualify
      - separate
      - reduce
      - withdraw
      - mark_capture_limit
    inventory_closed: false
    owner: 07_model/Admissibility_Rules.yaml
  referenced_but_not_owned:
    support_status: 04_reference/Claim_Type_Table.md and later 07_model/Transformation_Record.schema.json
    evidence_availability: 04_reference/Evidence_Map.md and later 07_model/Transformation_Record.schema.json
    claim_disposition: 04_reference/Claim_Type_Table.md and later 07_model/Transformation_Record.schema.json
    canonical_output_class: 07_model/Output_Classes.yaml
ordered_audit_contract:
  exact_stage_count: 12
  stages:
    - order: 1
      stage_id: source_and_claim_entry
      assessment_mode: declaration_entry
      purpose: Declare source basis, tested claim, scope, coordinates, and support limits.
      principal_rule_ids:
        - source_ceiling
        - contextual_boundedness
        - claim_ceiling
      external_or_cross_cutting_owners:
        - 07_model/Transformation_Record.schema.json
    - order: 2
      stage_id: operation_classification
      assessment_mode: operation_classification
      purpose: Classify the transformation as exactly one registered operation occurrence or stop before rule routing.
      principal_rule_ids: []
      external_or_cross_cutting_owners:
        - 07_model/Operation_Registry.yaml
        - 07_model/Boundary_Decision_Tree.yaml
    - order: 3
      stage_id: relevance_floor
      assessment_mode: substantive_assessment
      purpose: Test whether the transformation has praxeological purchase.
      principal_rule_ids:
        - praxis_purchase
      external_or_cross_cutting_owners: []
    - order: 4
      stage_id: traceability_ceiling
      assessment_mode: substantive_assessment
      purpose: Test whether the result retains traceable load.
      principal_rule_ids:
        - traceable_load
      external_or_cross_cutting_owners: []
    - order: 5
      stage_id: continuity_and_type_integrity
      assessment_mode: substantive_assessment
      purpose: Test type, reference, function, time, and relevant contextual continuity.
      principal_rule_ids:
        - type_integrity
        - reference_continuity
        - functional_continuity
        - temporal_continuity
        - contextual_boundedness
      external_or_cross_cutting_owners: []
    - order: 6
      stage_id: counterfactual_sensitivity
      assessment_mode: substantive_assessment
      purpose: Test whether relevant source-grounded change alters the result.
      principal_rule_ids:
        - counterfactual_sensitivity
      external_or_cross_cutting_owners: []
    - order: 7
      stage_id: loss_and_selection
      assessment_mode: substantive_assessment
      purpose: Audit selection and the five canonical loss dimensions.
      principal_rule_ids:
        - selection_and_loss
      external_or_cross_cutting_owners: []
    - order: 8
      stage_id: alternatives
      assessment_mode: substantive_assessment
      purpose: Preserve rivals, countercases, narrower claims, non-translation, and no-transformation options.
      principal_rule_ids:
        - alternatives
      external_or_cross_cutting_owners: []
    - order: 9
      stage_id: source_and_calibration_limits
      assessment_mode: substantive_assessment
      purpose: Test source support and discrimination limits.
      principal_rule_ids:
        - source_ceiling
        - calibration
      external_or_cross_cutting_owners: []
    - order: 10
      stage_id: anti_immunization
      assessment_mode: cross_cutting_assessment
      purpose: Prevent a new transformation from rescuing or erasing an earlier failed or bounded claim.
      principal_rule_ids: []
      external_or_cross_cutting_owners:
        - anti_immunization_contract
    - order: 11
      stage_id: stop_and_non_capture
      assessment_mode: preliminary_trigger_assessment
      purpose: Assess Stop, Claim Reduction handoff, and Non-Capture without false closure.
      principal_rule_ids:
        - stop
        - non_capture
        - claim_ceiling
      external_or_cross_cutting_owners:
        - claim_reduction_contract
    - order: 12
      stage_id: claim_and_authority_ceiling
      assessment_mode: final_ceiling_determination
      purpose: Set the maximum retained claim and independently enforce the Authority Ceiling.
      principal_rule_ids:
        - claim_ceiling
        - authority_ceiling
        - contextual_boundedness
      external_or_cross_cutting_owners: []
  audit_order_safeguards:
    later_stage_success_does_not_erase_earlier_failure_or_limit: true
    ordered_audit_not_class_precedence: true
    stage_completion_not_substantive_passage: true
    all_local_findings_remain_visible: true
    class_collision_resolution_owner: 07_model/Boundary_Decision_Tree.yaml
    assessment_mode_vocabulary_closed: false
    repeated_rule_id_not_duplicated_independent_test: true
  canonical_chapter_owner: Chapter 53
  canonical_sections: 53.1-53.18
  integrated_audit_connects_local_results_without_replacement: true
  one_record_per_operation_occurrence_required: true
  cross_stage_scoring_prohibited: true
  cross_stage_compensation_prohibited: true
  majority_vote_prohibited: true
  final_route_requires_explicit_claim_specific_reason: true
  local_and_handoff_results_preserved: true
  pressure_packet:
    A0: technical_and_local_consistency_is_sufficient_assertion_not_accepted
    E1: unadjudicated
    E2: unadjudicated
    E3_4: unadjudicated
    E5_6: unadjudicated
    E7_9: unadjudicated
    E10: unadjudicated
    E11: unadjudicated
    E12: unadjudicated
    FR: unadjudicated
  pressure_packet_result_selected: false
  chapter_level_result: admissible_but_provisional
  authority_inheritance: prohibited
rule_profiles:
  praxis_purchase:
    rule_id: praxis_purchase
    canonical_name: PraxisPurchase
    rule_role: Praxeological Relevance Floor check
    governing_question: Does the transformation change a warranted praxis-relevant reconstruction?
    positive_burden:
      - identify the proposed distinction or transformation difference
      - name at least one affected praxis dimension
      - state which warranted reconstruction or claim changes
      - provide source-supported grounds for that change
    valid_bounded_negative_or_unavailable_result:
      - neutral may preserve the coarser result
      - underdetermined may preserve uncertainty without a positive gain claim
      - below_floor may establish distinction without praxeological purchase
    failure_signals:
      - detail without changed reconstruction
      - event, role, component, temporal, profile, or label inflation
      - repeated reformulation without discrimination
      - refinement used to postpone an objection
    failure_signals_closed: false
    claim_effect_families:
      - retain
      - bound
      - qualify
      - reduce
      - withdraw
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: relevance_floor_boundary_result
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates for failure or 
      limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
        - applicability and rationale where conditional
        - control-source pointer
        - evidence or artifact pointer
        - reasoned finding
        - claim or artifact effect
        - required action
        - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
      - analogy_only
      - partially_admissible
      - claim_reduction_required
      - mandatory_stop
      - failed_transformation
      - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
      - local result uses the controlled relevance-floor vocabulary
      - affected praxis dimension is declared
      - finding and claim effect are present
    substantive_judgment_required:
      - whether the difference changes a warranted reconstruction
      - whether the stated praxis dimension is materially affected
    critical_boundaries:
      - neutral result != failed transformation
      - neutral result != automatic mandatory_stop
      - further repetitive work after neutrality may separately trigger stop
    prohibited_inferences:
      - more detail implies more truth
      - neutrality automatically means mandatory stop
    prohibited_inferences_are_minimum_not_exhaustive: true
  traceable_load:
    rule_id: traceable_load
    canonical_name: TraceableLoad
    rule_role: Praxeological Traceability Ceiling check
    governing_question: Can the result be reconstructed from declared load-bearing source features and relations?
    positive_burden:
      - identify constitutive source load
      - preserve source-to-result dependency
      - disclose selection, compression, and loss
      - preserve relational, temporal, cost, asymmetry, Non-Event, and binding traces where constitutive
      - show that relevant source change would matter
    valid_bounded_negative_or_unavailable_result:
      - within_ceiling may coexist with substantial disclosed loss
      - claim_reduction may signal a narrower retest
      - underdetermined may preserve a limited or unavailable ceiling finding
    failure_signals:
      - source-indifferent label
      - reference-destroying fragmentation
      - macro-label elasticity
      - metaphor substituted for structural continuity
      - citation presence without constraining load
    failure_signals_closed: false
    claim_effect_families:
      - retain
      - bound
      - qualify
      - reduce
      - withdraw
      - mark_capture_limit
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: traceability_ceiling_boundary_result
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates for failure or 
      limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
        - applicability and rationale where conditional
        - control-source pointer
        - evidence or artifact pointer
        - reasoned finding
        - claim or artifact effect
        - required action
        - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
      - analogy_only
      - partially_admissible
      - claim_reduction_required
      - mandatory_stop
      - failed_transformation
      - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
      - local result uses the controlled ceiling vocabulary
      - constitutive source trace is declared
      - loss fields use the canonical inventory
    substantive_judgment_required:
      - whether source features are genuinely load-bearing
      - whether the result remains reconstructively anchored
    critical_boundaries:
      - TraceableLoad != exhaustive retention
      - TraceableLoad != citation presence
      - TraceableLoad != causal proof
    prohibited_inferences:
      - traceability means exhaustive retention
      - citation presence means traceable load
      - traceability proves causality
    prohibited_inferences_are_minimum_not_exhaustive: true
  type_integrity:
    rule_id: type_integrity
    canonical_name: TypeIntegrity
    rule_role: Object, type, function, and level integrity check
    governing_question: Are operator type, operator occurrence, composite, origin type, and target function kept distinct?
    positive_burden:
      - prohibit operator-type decomposition
      - preserve origin type under PROJECT_AS
      - prohibit automatic type inheritance from whole to parts
      - keep derived functions outside the Δ–Ψ primitive inventory
      - mark level, frame, and granularity relations
    valid_bounded_negative_or_unavailable_result:
      - DECOMPOSE may revise or reject an occurrence typing without decomposing the operator type
      - a derived profile or weighting may remain bounded without becoming a primitive
    failure_signals:
      - operator type decomposed
      - origin type replaced by target function
      - derived function promoted to primitive
      - unmarked level or granularity mixing
      - projection treated as operator identity
    failure_signals_closed: false
    claim_effect_families:
      - retain
      - bound
      - separate
      - reduce
      - withdraw
    claim_effect_families_closed: false
    controlled_local_result_vocabulary:
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates for failure or 
      limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
        - applicability and rationale where conditional
        - control-source pointer
        - evidence or artifact pointer
        - reasoned finding
        - claim or artifact effect
        - required action
        - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
      - analogy_only
      - partially_admissible
      - claim_reduction_required
      - mandatory_stop
      - failed_transformation
      - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
      - declared source and target types remain separate
      - no forbidden primitive or fourth operation is introduced
    substantive_judgment_required:
      - whether an occurrence typing remains materially warranted
      - whether a distinction is a real type boundary rather than wording
    critical_boundaries:
      - operator type != operator occurrence != composite
      - origin type != target function
      - derived object or function != new PMS primitive
    prohibited_inferences:
      - formal typing proves semantic correctness
      - type integrity authorizes a person or domain judgment
    prohibited_inferences_are_minimum_not_exhaustive: true
  reference_continuity:
    rule_id: reference_continuity
    canonical_name: ReferenceContinuity
    rule_role: Reference-object identity check
    governing_question: Does the transformation retain the relevant source or reference object?
    positive_burden:
      - state the reference object
      - preserve identity criteria or declare a changed object
      - retain constitutive relations sufficient for the tested claim
    valid_bounded_negative_or_unavailable_result:
      - COMPOSE may form a new composite while source identities remain visible
      - a changed reference requires a new claim or record rather than silent continuation
    failure_signals:
      - same name with exchanged object
      - historical or structural reference drift
      - source replacement disguised as transformation
    failure_signals_closed: false
    claim_effect_families:
      - retain
      - bound
      - separate
      - reduce
      - withdraw
      - mark_capture_limit
    claim_effect_families_closed: false
    controlled_local_result_vocabulary:
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates for failure or 
      limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
        - applicability and rationale where conditional
        - control-source pointer
        - evidence or artifact pointer
        - reasoned finding
        - claim or artifact effect
        - required action
        - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
      - analogy_only
      - partially_admissible
      - claim_reduction_required
      - mandatory_stop
      - failed_transformation
