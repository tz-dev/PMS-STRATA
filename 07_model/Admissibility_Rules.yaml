  claim_and_routing_contract:
    mixed_claim_segmentation_required: true
    claim_reduction_requires_reformulation_and_retest: true
    exact_canonical_output_class_count: 10
    local_findings_do_not_select_output_class: true
    route_selection_remains_substantive: true
  stop_and_non_capture:
    mandatory_stop_blocks_impermissible_continuation: true
    stop_does_not_delete_prior_valid_findings: true
    non_capture_preserves_rivals_limits_and_reentry: true
    non_capture_does_not_validate_stronger_claim: true
  no_universal_scale:
    universal_minimum_praxis_unit_prohibited: true
