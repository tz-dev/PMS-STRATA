    - partially_sensitive
    - insensitive
    - underdetermined
    - not_testable_with_available_sources
    local_findings_not_output_classes: true
    causal_proof_prohibited: true
    necessity_proof_prohibited: true
    prediction_prohibited: true
    missing_information_not_non_event: true
  integrity_and_continuity_handoff:
    type_integrity_non_compensable: true
    reference_continuity_independently_applicable: true
    functional_continuity_independently_applicable: true
    temporal_continuity_independently_applicable: true
