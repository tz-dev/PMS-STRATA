  - empirical truth
  - actual causality
  - semantic validity
  - normative validity
  - person typing or diagnosis
  - legal legitimacy
  - political legitimacy
  - sanction or intervention recommendation
  - application authority
  - PMS or STRATA superiority
  machine_readable_consistency_not_truth_proof: true
