      - preserved result is present when stop is reached
      - re-entry conditions are present when stop is reached or re-entry is contemplated
    substantive_judgment_required:
      - whether continuation is inadmissible or merely unnecessary
      - whether a trigger is materially reached
    critical_boundaries:
      - resolution_neutral != automatic mandatory_stop
      - stop trigger != automatic canonical class selection
      - optional stop != eleventh Output Class
    prohibited_inferences:
      - optional stop is an eleventh Output Class
      - neutrality automatically means mandatory stop
    prohibited_inferences_are_minimum_not_exhaustive: true
  non_capture:
    rule_id: non_capture
    canonical_name: NonCapture
    rule_role: Adequate-capture and false-closure boundary
    governing_question: Does an adequate retained claim remain without distortion, unsupported extension, destruction of a constitutive 
      feature, or false closure?
    positive_burden:
      - assess whether an adequate retained claim remains for every operation occurrence
      - when partial capture or a capture limit is asserted, state attempted operations
      - when partial capture or a capture limit is asserted, state captured and uncaptured structure
      - when partial capture or a capture limit is asserted, identify the limiting condition
      - when partial capture or a capture limit is asserted, preserve rivals or alternatives
      - when canonical non_capture is under consideration, state claim effect and re-entry condition
    valid_bounded_negative_or_unavailable_result:
      - partial capture may coexist with Whole-Claim Non-Capture
      - a bounded or provisional adequate retained claim may prevent non_capture for that same delimited claim
      - separate analogical or partial claims do not automatically prevent broader Non-Capture
    failure_signals:
      - missing information treated as a result
      - Non-Capture used to shield a weak claim
      - unreasoned semantic exteriority
      - new primitive inferred from remainder
    failure_signals_closed: false
    claim_effect_families:
      - retain
      - separate
      - withdraw
      - mark_capture_limit
    claim_effect_families_closed: false
    controlled_local_result_vocabulary: non_capture_form
    conditional_payload_contract:
      adequate_capture_assessment_required_for_every_occurrence: true
      detailed_capture_boundary_payload_required_only_when:
        - partial capture is asserted
        - a non-capture form is asserted
        - canonical non_capture is under consideration
      ordinary_positive_assessment_may_state:
        - adequate retained claim remains
        - no material capture limit asserted
      no_non_capture_pseudo_value_required: true
    non_compensation_rule: No success, detail, source volume, formal completeness, or result on another axis compensates for failure or 
      limitation of this rule.
    record_handoff:
      occurrence_assessment_required_when_applicable: true
      assessment_semantics_defined_here: true
      field_syntax_owner: 07_model/Transformation_Record.schema.json
      minimum_semantic_content:
        - applicability and rationale where conditional
        - control-source pointer
        - evidence or artifact pointer
        - reasoned finding
        - claim or artifact effect
        - required action
        - controlled local result where the corresponding condition is reached
    compatible_final_output_classes:
      - admissible
      - admissible_with_bounded_claim
      - admissible_but_provisional
      - resolution_neutral
      - analogy_only
      - partially_admissible
      - claim_reduction_required
      - mandatory_stop
      - failed_transformation
      - non_capture
    final_class_compatibility_not_route_selection: true
    machine_checkable_aspects:
      - an adequate-capture assessment is present for every occurrence
      - capture and non-capture statements are separated where a capture boundary is asserted
      - attempted operations, captured and uncaptured structure, and limiting condition are recorded only when the detailed capture-boundary
        payload is required
      - partial capture can be represented independently
      - no no_non_capture pseudo-value is required or permitted
    substantive_judgment_required:
      - whether an adequate retained claim remains for the same delimited tested claim
      - whether a constitutive feature is destroyed by capture
    critical_boundaries:
      - Non-Capture concept != non-capture claim != non_capture class
      - partial capture != automatic partially_admissible
      - missing information != Non-Event != Non-Capture
    prohibited_inferences:
      - missing information mechanically establishes Non-Capture
      - remainder authorizes a new primitive
      - Non-Capture immunizes a weak claim
    prohibited_inferences_are_minimum_not_exhaustive: true
non_compensation_contract:
  no_scoring: true
  no_weighting: true
  no_averaging: true
  no_threshold_sum: true
  no_compensation_across_load_bearing_checks: true
  later_success_does_not_erase_earlier_failure_or_limit: true
  formal_completeness_does_not_establish_substantive_passage: true
  examples:
    - high detail cannot compensate for absent PraxisPurchase
    - many citations cannot compensate for absent TraceableLoad
    - strong sources cannot compensate for a type jump
    - traceability cannot compensate for Authority Ceiling failure
    - formal completeness cannot compensate for an unbounded claim
    - Counterfactual Sensitivity cannot become causal proof
    - a successful later operation cannot erase an earlier failed claim
    - a larger composite cannot confer authority
  qualified_result_rule: A failed or limited load-bearing check may contribute to a qualified, reduced, stopped, failed, or capture-limited 
    final result, but each canonical class still requires its own class-specific conditions and the full cross-rule pattern.
  not_all_checks_positive_does_not_mean_no_legitimate_methodological_result: true
  class_specific_conditions_remain_required: true
  generic_check_limitation_does_not_license_specialized_class: true
claim_reduction_contract:
  role: Rule-level governance relation; not an Output Class definition and not route selection.
  trigger_dimensions:
    - relation
    - reach
    - precision
    - generality
    - functional_scope
    - dependence_strength
    - object_class
    - temporal_scope
    - contextual_scope
  trigger_dimensions_closed: false
  required_conditions:
    - the current claim exceeds a warranted dimension
    - a concrete weaker formulation has identifiable source- or rule-grounded reasons sufficient to justify reformulation and retesting
    - the weaker formulation is not pre-authorized as admissible
    - the original stronger claim and its failure or limitation remain recorded
    - the revised claim receives a new or revised test
  separations:
    - claim reduction != support downgrade
    - claim reduction != resolution neutrality
    - claim reduction != source-function effect
    - claim reduction != automatic admissibility of the reduced claim
  compatible_final_output_class: claim_reduction_required
  final_class_compatibility_not_route_selection: true
  canonical_chapter_owner: Chapter 51 §51.7
  support_downgrade_separate: true
  resolution_neutral_separate: true
  original_claim_preserved: true
  reduced_claim_independently_testable: true
stop_and_reentry_contract:
  mandatory_stop:
    meaning: Continuation of the current operation or claim would violate a load-bearing gate.
    current_trigger_families:
      - continued work below the Relevance Floor
      - lost TraceableLoad
      - Source Ceiling exceeded
      - Type Integrity or reference identity cannot be maintained
      - non-discriminating calibration
      - Authority Ceiling violation
      - anti-immunization rescue
      - continued unsupported or repetitive detail
      - contextual boundedness cannot be stated
      - a countercase is merely moved to another level, frame, granularity, composition, or target function
    trigger_families_closed: false
  optional_stop:
    meaning: Continuation may remain admissible but is unnecessary for the current claim.
    current_trigger_families:
      - the present claim is already sufficient
      - a neutral comparison establishes no need for further refinement
      - no-transformation is preferable without making continuation inadmissible
    trigger_families_closed: false
    creates_output_class: false
  reentry:
    requires_one_or_more:
      - new source basis
      - materially different claim
      - newly visible counterstructure
      - newly warranted calibration
      - new or materially different distinction or question
      - newly justified granularity
      - restored Source Trace
      - independent new operation and claim
    new_or_revised_record_required: true
    prior_result_preserved: true
    prior_failure_preserved_where_present: true
    unrecorded_continuation_prohibited: true
    reentry_reason_families_closed: false
    reentry_requires_changed_condition: true
  stop_trigger_not_automatic_class_selection: true
