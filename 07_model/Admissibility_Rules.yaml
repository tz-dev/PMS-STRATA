  - whether reference identity is materially preserved
  - whether a function is semantically continuous
  - whether a counterfactual modification is relevant
  - whether sources are sufficient
  - whether calibration discriminates real cases
  - whether a rival is serious
  - whether a weaker claim has grounds sufficient for retesting
  - whether adequate capture remains
