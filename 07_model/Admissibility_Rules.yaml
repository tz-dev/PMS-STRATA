artifact:
  id: pms_strata_admissibility_rules
  title: PMS-STRATA Admissibility Rules
  version: 0.2.0
  status: active_formal_model
  artifact_role: Machine-readable formalization of the sixteen canonical STRATA admissibility checks, controlled local result vocabularies, 
    non-compensation, governance triggers, and formal handoffs.
  registered_scope:
    - semantics of the sixteen canonical admissibility checks
    - explicitly controlled local result vocabularies
    - non-compensatory gate architecture
    - ordered twelve-stage audit contract
    - Claim Reduction, Stop, Non-Capture, anti-immunization, Claim Ceiling, and Authority Ceiling rules
    - operation-specific rule overlays without operation redefinition
    - formal-model and cross-artifact ownership boundaries
  governing_authority_sources:
    - path: PMS.yaml
      role: unchanged external PMS Base dependency
  governing_repository_controls:
    - path: 00_source/PMS-STRATA_Structure.md
      role: architecture and chapter blueprint
    - path: 05_minified/PMS_STRATA_Claim_Boundary_Minified.md
      role: claim and authority boundary control
    - path: 05_minified/PMS_STRATA_Operation_Signatures_Minified.md
      role: operation-local admissibility and failure control
    - path: 05_minified/PMS_STRATA_Admissibility_Band_Minified.md
      role: primary compact admissibility-rule and vocabulary control
    - path: 05_minified/PMS_STRATA_Minified_Canonical.md
      role: canonical compact system and output control
    - path: 05_minified/Block_Contracts.md
      role: block-level control contract
    - path: 05_minified/Chapter_Contracts.md
      role: chapter-level control contract
  existing_formal_inputs:
    - path: 07_model/Operation_Registry.yaml
      role: owns operation identity, common check identifiers, and operation-level applicability
    - path: 07_model/Output_Classes.yaml
      role: owns the ten canonical Output Class identities, meanings, and semantic boundaries
  supporting_reference_inputs:
    - path: 04_reference/Admissibility_Band_Reference.md
      role: principal admissibility semantics support without independent theory authority
    - path: 04_reference/Audit_Checklist.md
      role: audit-stage and checklist support without independent theory authority
    - path: 04_reference/Claim_Type_Table.md
      role: claim, resolution, support, and capture separation support without independent theory authority
    - path: 04_reference/Evidence_Map.md
      role: source, evidence, support, and warrant routing support without independent theory authority
    - path: 04_reference/Non_Equivalence_Index.md
      role: boundary and category-collapse control without independent theory authority
    - path: 04_reference/Transformation_Operation_Index.md
      role: operation-local rule support without independent theory authority
    - path: 04_reference/Output_Class_Index.md
      role: output-boundary support without class redefinition or route selection
    - path: 04_reference/Glossary.md
      role: terminology support without independent theory authority
    - path: 04_reference/Cross_Reference_Map.md
      role: cross-artifact navigation support without independent theory authority
    - path: 04_reference/Reader_Pathways.md
      role: formal-model navigation and reading-route support without independent theory authority
  prose_precedence: This rules artifact mirrors and tests the active controlled prose. It does not replace PMS Base, canonical corpus prose,
    binding compact controls, or substantive human and domain-grounded judgment.
  non_authority_statement: Rule completeness, local vocabulary validity, YAML validity, schema validity, audit-stage completion, or 
    compatible final-class references do not establish substantive admissibility, empirical truth, actual causality, semantic validity, 
    normative validity, person judgment, legitimacy, intervention warrant, or application authority.
model_layering:
  purpose: Distinguish the active formal-rule core from cross-artifact routing metadata without creating a second rule registry or 
    increasing authority.
  active_formal_rule_core:
    authority_scope: formal_operationalization_only
    upstream_precedence_preserved: true
    top_level_keys:
      - rule_registry_constraints
      - shared_rule_contract
      - controlled_local_vocabularies
      - ordered_audit_contract
      - rule_profiles
      - non_compensation_contract
      - claim_reduction_contract
      - stop_and_reentry_contract
      - non_capture_contract
      - anti_immunization_contract
      - claim_and_authority_ceiling_contract
      - operation_specific_rule_overlays
      - formal_model_boundary
    may_be_read_as_empirical_truth_or_application_authority: false
  integration_metadata:
    top_level_keys:
      - cross_artifact_handoffs
      - chapter_formal_carrier_boundary
    role: cross-artifact routing and ownership metadata without independent rule semantics
    may_override_active_rule_core: false
  interpretation_order:
    - upstream canonical prose and Minified controls
    - active formal-rule core within this artifact
    - cross-artifact routing metadata
  authority_inheritance: prohibited
rule_registry_constraints:
  exact_rule_count: 16
  canonical_rule_ids:
    - praxis_purchase
    - traceable_load
    - type_integrity
    - reference_continuity
    - functional_continuity
    - temporal_continuity
    - contextual_boundedness
    - counterfactual_sensitivity
    - source_ceiling
    - calibration
    - selection_and_loss
    - alternatives
    - claim_ceiling
    - authority_ceiling
    - stop
    - non_capture
  rule_ids_must_match_operation_registry: true
  additional_core_check_prohibited: true
  anti_immunization_is_cross_cutting_not_core_check: true
  rule_order_is_audit_navigation_not_rank: true
  universal_check_score_prohibited: true
  universal_pass_fail_enum_prohibited: true
  weighted_gate_aggregation_prohibited: true
  threshold_sum_prohibited: true
  confidence_to_class_algorithm_prohibited: true
  severity_scale_prohibited: true
  authority_score_prohibited: true
  granularity_score_prohibited: true
  capture_percentage_prohibited: true
  formal_completeness_not_substantive_passage: true
  final_class_compatibility_not_route_selection: true
  output_class_identity_owner: 07_model/Output_Classes.yaml
  route_selection_owner: 07_model/Boundary_Decision_Tree.yaml
  operation_identity_and_applicability_owner: 07_model/Operation_Registry.yaml
  occurrence_field_syntax_owner: 07_model/Transformation_Record.schema.json
  authority_inheritance: prohibited
  new_pms_primitive_prohibited: true
  fourth_operation_prohibited: true
  eleventh_output_class_prohibited: true
  local_rule_finding_never_sufficient_for_final_class: true
  full_applicable_rule_pattern_required: true
  rule_level_compatibility_is_non_exclusionary: true
  compatibility_does_not_predict_final_class: true
shared_rule_contract:
  rule_entry_required_keys:
    - rule_id
    - canonical_name
    - rule_role
    - governing_question
    - positive_burden
    - valid_bounded_negative_or_unavailable_result
    - failure_signals
    - failure_signals_closed
    - claim_effect_families
    - claim_effect_families_closed
    - controlled_local_result_vocabulary
    - non_compensation_rule
    - record_handoff
    - compatible_final_output_classes
    - final_class_compatibility_not_route_selection
    - machine_checkable_aspects
    - substantive_judgment_required
    - critical_boundaries
    - prohibited_inferences
    - prohibited_inferences_are_minimum_not_exhaustive
  applicability_contract:
    owner: 07_model/Operation_Registry.yaml
    allowed_values_owned_elsewhere:
      - required
      - conditional
      - not_applicable
    rules_file_does_not_override_applicability: true
    not_applicable_not_passed: true
    pending_evidence_not_not_applicable: true
    conditional_non_applicability_requires_condition_and_rationale: true
  assessment_anatomy:
    semantic_elements:
      - applicability
      - control-source pointer
      - evidence or artifact pointer
      - finding
      - claim effect or artifact effect
      - required action
      - controlled local result where the corresponding condition is reached
      - canonical class selected elsewhere
    semantic_owner: 07_model/Admissibility_Rules.yaml
    field_syntax_owner: 07_model/Transformation_Record.schema.json
  finding_contract:
    reasoned_finding_required: true
    open_finding_text_permitted: true
    unavailable_result_must_not_be_encoded_as_pass: true
    negative_but_valid_result_must_not_be_encoded_as_failure_automatically: true
    local_result_not_output_class: true
    support_status_not_local_result: true
    claim_type_not_local_result: true
    source_function_effect_not_local_result: true
  diagnostic_family_lists_closed: false
  prohibited_inferences_are_minimum_not_exhaustive: true
  final_class_compatibility_contract:
    local_rule_finding_never_sufficient_for_final_class: true
    full_applicable_rule_pattern_required: true
    route_selection_owner: 07_model/Boundary_Decision_Tree.yaml
    decision_tree_consumes:
      - reasoned findings
      - controlled local results where corresponding conditions are reached
      - the full cross-rule pattern
    rule_level_compatibility_is_non_exclusionary: true
    compatibility_does_not_predict_final_class: true
    specialized_class_conditions_remain_owned_by:
      - 07_model/Output_Classes.yaml
      - 07_model/Boundary_Decision_Tree.yaml
controlled_local_vocabularies:
