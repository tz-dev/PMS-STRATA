claim:
  claim_id: claim.c40-x6.analogy.01
  statement: Within synthetic transition-comparison context TCC, the independently reconstructed C17-LAMBDA-01 Trajectory
    and a technical workflow transition trace retain a bounded structural analogy across ordered phases, a missed or
    skipped transition, later workaround persistence, and partial rollback. The stronger claim that the historical Trajectory
    performs a transition-debugging function for the technical workflow is not retained because semantic preservation
    and constitutive source-function dependence are not established.
  claim_type:
    value: bounded structural analogy with unretained projection candidate
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: Case-local label for the canonical Chapter-37/40 analogy-versus-projection boundary; no new
      claim type is created.
  claim_role:
    value: primary routed analogy claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
    reference_object_boundary: Only composite.c17-lambda-01 and the declared synthetic technical workflow trace workflow.trace.tcc-01.
    operation_occurrence_boundary: Only attempted PROJECT_AS occurrence project-as.c40-x6.01 and its retained analogy
      result.
    frame:
      value: synthetic cross-domain transition-comparison frame TCC
      control_source: 03_cases/yaml/C40-X6_Projection_versus_Structural_Analogy.yaml#/target/frame
      inventory_status: extension
      extension_rationale: Case-local comparison frame only.
    granularity:
      value: phase-state and transition-relation comparison granularity
      control_source: 03_cases/yaml/C40-X6_Projection_versus_Structural_Analogy.yaml#/target/granularity
      inventory_status: extension
      extension_rationale: Case-local granularity for selected formal correspondences and explicit residuals.
    relative_level:
      value: comparison relation between origin-typed historical Trajectory and technical workflow trace
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Instantiates a cross-domain comparison without asserting ontological level identity.
    temporal_scope: Historical source Q0–Q5; technical comparison trace s0–s5; no shared empirical clock is claimed.
    source_scope: Exactly the bounded C17-LAMBDA-01 Trajectory and the synthetic technical trace declared in this record.
    context_scope: Only formal comparison in TCC; no transfer into a real technical or institutional system.
    generalization_boundary: No semantic identity, target function, causal mechanism, universal workflow model, or cross-domain
      validity beyond the declared analogy.
    excluded_reach:
    - No claim that the historical Trajectory becomes a technical workflow, algorithm, state machine, Frame operator,
      or new PMS primitive.
    - No claim that expectation, responsibility, binding, exit cost, or historical uncertainty are preserved by the technical
      trace.
    - No claim that executable similarity establishes a transition-debugging function or application guidance.
    - No person typing, diagnosis, legitimacy, sanction, intervention, recommendation, or authority transfer.
  validity_scope: Valid only as a bounded structural analogy in synthetic comparison context TCC.
  claim_ceiling:
    asserted_relation: 'Selected formal relations correspond: ordered phases to states, the missed review position to
      a skipped transition node, workaround persistence to a repeated fallback branch, and partial repair to rollback-with-residual-state.'
    reach: One synthetic historical Trajectory, one synthetic workflow trace, and one declared comparison context.
    precision: Formal correspondence, declared residuals, breaking points, source/target asymmetry, and defeat conditions
      only.
    generality: No transfer to other trajectories, workflows, domains, implementations, or empirical systems.
    functional_scope: No contextual target function is retained; the stronger transition-debugging projection remains
      unestablished.
    dependence_strength: The analogy weakens if the selected formal relations are removed, but it does not become a target
      function merely because those relations remain.
    inferential_distance: One attempted PROJECT_AS boundary test resulting in a retained analogy claim rather than a
      functional projection.
    limiting_sources:
    - source.record.c17-lambda-01
    - source.fixture.c40-x6.workflow-trace-tcc
    rationale: The packet supports a useful bounded resemblance and explicit breaking points, but not semantic preservation
      or a source-traceable target function.
  authority_boundary: The record authorizes only the bounded methodological classification analogy_only; it grants no
    technical design decision, empirical truth, causal proof, semantic identity, person judgment, or application authority.
