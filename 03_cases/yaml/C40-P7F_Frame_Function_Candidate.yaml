    claim_limitation: Supports structural persistence, not quantitative cost or causal monopoly.
    source_pointer: 03_cases/markdown/C40-P7F_Recurrent_Trajectory_Form_as_Attractor_Function.md#5-attractor-load
  - trace_id: trace.c40-p7f.constrained-reopening
    source_feature: Partial repair or reopening changes the course without restoring a clean pre-history corridor.
    affected_claim_component: Dynamic rather than static attractor work and bounded reopening corridor.
    trace_role: load_bearing
    result_dependency: A full reset removes the recurrent constrained-reopening relation and may defeat projection.
    expected_result_change: Full reopening supports no additional dynamic function from R7 in the declared target field.
    temporal_or_relational_dependency: Reopening is a later transition position, not an endpoint identity.
    claim_limitation: Exact residual-cost magnitude remains uncertain.
    source_pointer: 03_cases/markdown/C40-P7F_Recurrent_Trajectory_Form_as_Attractor_Function.md#6-counterfactual-attractor-test
  - trace_id: trace.c40-p7f.target-uptake
    source_feature: In C7, planning precedent, approval templates, role expectations, reserved resources, and release costs
      make the familiar transition form easier to continue and clean reset harder to access.
    affected_claim_component: Shared recurrent-form source boundary and candidate-specific frame-function continuity in C7.
    trace_role: load_bearing
    result_dependency: Without source-form uptake and differential access/friction, R7 remains descriptive background only.
    expected_result_change: Removing uptake or substituting N7 yields no projection.
    temporal_or_relational_dependency: Source-form availability precedes and conditions the C7 transition choice; it does
      not determine it.
    claim_limitation: Supports one structural access/cost relation, not probability, prediction, or causality.
