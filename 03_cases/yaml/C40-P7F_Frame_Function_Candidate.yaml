  - trace_id: trace.c40-p7f.recurrent-order
    source_feature: Across T1–T3, a provisional or temporary arrangement is followed by deferred or incomplete coordination
      reset, retained resource/role load, and constrained reopening.
    affected_claim_component: Discriminating recurrent transition-form source R7.
    trace_role: load_bearing
