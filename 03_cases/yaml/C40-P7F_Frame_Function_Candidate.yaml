operation:
  occurrence_id: project-as.c40-p7f.01
  kind: PROJECT_AS
  justification: Test R7 for one bounded historical frame-function in the shared C7 coordinates; the dynamic attractor-function
    rival is tested in a separate sibling record.
  expected_praxeological_difference: Distinguish source-dependent narrowing of credible interpretations and role expectations
    from source-only relevance and from the rival transition-access account.
  selection_rule: Foreground sedimented expectations, inherited interpretation defaults, role expectation, revision cost,
    and target uptake; preserve the attractor rival and no-projection.
  transformation_context: Synthetic same-coordinate continuation field C7, C7-R0–R4.
  details:
    target_context: shared continuation field C7, same target object/level/frame/granularity/window as the sibling candidate
    constitutive_source_trace:
    - trace_id: trace.c40-p7f.sedimented-expectations
      source_feature: Across R7, temporary arrangements repeatedly survive nominal review or repair and become expected starting
        points.
      affected_claim_component: Credible interpretation set and role expectations in C7.
      trace_role: load_bearing
      result_dependency: Without sedimented expectation, the historical frame-function narrows or fails.
      expected_result_change: A clean reset or independently regenerated target interpretation supports source-only or no
        projection.
      temporal_or_relational_dependency: Expectation must remain linked to incomplete reset and later uptake, not chronology
        alone.
      claim_limitation: Supports one bounded interpretive/role function, not determinism or motive.
      source_pointer: /source/constitutive_source_trace
    - trace_id: trace.c40-p7f.revision-cost
      source_feature: Repeated incomplete reset accumulates practical and interpretive revision cost.
      affected_claim_component: Which transition interpretations and coordination moves remain credible.
      trace_role: load_bearing
      result_dependency: Removing inherited revision cost weakens the frame-function.
      expected_result_change: Equalized revision cost leaves the attractor rival or current-condition account open.
      temporal_or_relational_dependency: Cost must be retained into C7 through explicit target uptake.
      claim_limitation: No quantitative or causal magnitude is claimed.
      source_pointer: /source/source_ceiling
    source_reference_preserved: true
    origin_type_preserved: true
    target_function_bounded: true
    alternative_projection_or_no_projection:
    - bounded dynamic attractor-function in sibling record C40-P7G
    - source-only recurrent-form description
    - current-condition account
    - no projection
    - narrower role-specific frame-function
    target_contextual_function_pointer: /target/contextual_function
    source_reference_object_pointer: /source/reference_object
    origin_type_pointer: /source/object_typing
    target_reference_object_pointer: /target/reference_object
    target_frame_pointer: /target/frame
    validity_scope_pointer: /target/validity_scope
