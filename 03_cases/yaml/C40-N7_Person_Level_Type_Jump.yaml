operation:
  occurrence_id: project-as.c40-n7.01
  kind: PROJECT_AS
  justification: The record deliberately tests a declared PROJECT_AS candidate that transfers a bounded configuration-level
    function to a stable person property; the audit determines whether that type and level jump is admissible.
  expected_praxeological_difference: A valid person-level target function would require a person-specific, context-bounded
    difference that changes with person identity; the tested claim instead follows configuration relations.
  selection_rule: Retain the source configuration, prior bounded function, p7 role participation, person-replacement and configuration-removal
    variations; exclude essence, diagnosis, trait, motive, rank, legitimacy, recommendation, sanction, and cross-context generalization.
  transformation_context: Synthetic C3 person-attribution review with comparison context D7.
  details:
    target_context: synthetic C3/D7 person-attribution review
    constitutive_source_trace: *id001
    source_reference_preserved: true
    origin_type_preserved: true
    target_function_bounded: false
    alternative_projection_or_no_projection:
    - bounded role-participation relation in a new record
    - configuration-only function
    - source-only description of role and relations
    - no person or group projection
    target_contextual_function_pointer: /target/contextual_function
    source_reference_object_pointer: /source/reference_object
    origin_type_pointer: /source/object_typing
    target_reference_object_pointer: /target/reference_object
    target_frame_pointer: /target/frame
    validity_scope_pointer: /target/validity_scope
