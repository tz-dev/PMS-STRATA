claim:
  claim_id: claim.c40-n7.person-type-jump.01
  statement: Within synthetic coordination configuration C3 during C3-R0–R4, role-holder p7 is claimed to be an intrinsic
    attractor type or binding type because p7 participates in a configuration in which recurrent form R3 performs a bounded
    dynamic attractor-function. The declared PROJECT_AS claim is rejected because a configuration-level function and bounded
    participation relation do not constitute a stable person property, diagnosis, motive, rank, or sanction basis.
  claim_type:
    value: failed person-level contextual-function claim
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: Case-local label for the canonical Chapter-40 N7 countercase; no new claim type is created.
  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
    reference_object_boundary: Only configuration.c40-n7.c3-role-field, recurrent form R3 as already bounded in C40-P3, role-holder
      p7, role r_coord, and comparison context D7.
    operation_occurrence_boundary: Only PROJECT_AS occurrence project-as.c40-n7.01.
    frame:
      value: synthetic C3 role-participation and person-attribution review frame
      control_source: 03_cases/yaml/C40-N7_Person_Level_Type_Jump.yaml#/target/frame
      inventory_status: extension
      extension_rationale: Case-local target frame used only to test person-level type jumping.
    granularity:
      value: configuration-role-person attribution granularity
      control_source: 03_cases/yaml/C40-N7_Person_Level_Type_Jump.yaml#/target/granularity
      inventory_status: extension
      extension_rationale: Case-local granularity distinguishing configuration function, role relation, and person predicate.
    relative_level:
      value: attempted person-property level relative to a configuration-level function
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Case-local level relation used to expose the prohibited jump.
    temporal_scope: Source configuration C3-R0–R4; p7 participation C3-R1–R3; comparison D7-R0–R2.
    source_scope: Exactly the bounded C3 configuration/function result from C40-P3 plus the declared synthetic role-participation
      fixture.
    context_scope: Only synthetic C3 and comparison context D7.
    generalization_boundary: No person or group trait, diagnosis, motive, maturity, rank, legitimacy, recommendation, sanction,
      or cross-context generalization is retained.
    excluded_reach:
    - No conversion of configuration function into person or group essence.
    - No inference from participation to stable trait, diagnosis, motive, moral rank, maturity, legitimacy, recommendation,
      or sanction.
    - No generalization from C3 to later contexts or group members.
    - No application to real persons, organizations, legal statuses, clinical states, or governance decisions.
  validity_scope: The failed-operation assessment is valid only for the declared synthetic C3/D7 comparison and the stated
    person-property claim.
  claim_ceiling:
    asserted_relation: p7 is an intrinsic attractor type or binding type because p7 participates in C3 while C3 carries a
      bounded attractor-function.
    reach: p7, C3-R0–R4, role r_coord, and comparison context D7 only.
    precision: Source configuration, prior bounded function, declared role participation, person-replacement test, configuration-removal
      test, and cross-context comparison.
    generality: One synthetic person, one role, one configuration, and one comparison context.
    functional_scope: No person-level function is retained; only the failed PROJECT_AS claim and the bounded configuration/participation
      relations remain recorded.
    dependence_strength: The alleged person property remains asserted despite person replacement and disappears when the configuration
      changes, demonstrating dependence on configuration rather than person identity.
    inferential_distance: One attempted PROJECT_AS step that improperly transfers a configuration-level function to a stable
      person property.
    limiting_sources:
    - source.record.c40-p3
    - source.case.c40-n7.role-fixture
    rationale: The packet supports the configuration function and bounded role participation but not intrinsic person typing.
  authority_boundary: The record authorizes only rejection of this synthetic person-type claim; it grants no diagnosis, person
    evaluation, rank, legitimacy decision, recommendation, sanction, or application authority.
