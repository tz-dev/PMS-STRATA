claim:
  claim_id: claim.c40-n3.label-substitution.01
  statement: Within synthetic renewal-review scene R1 at t4, the independently reconstructed service-activation Path
    from C17-LINEAR-01 is claimed to perform an eligibility-gate function merely because a review-template registry assigns
    that label to every authorization-bearing Path. The declared PROJECT_AS claim is rejected because the label does
    not depend on the source Path's constitutive identity, order, continuation relations, or Loss.
  claim_type:
    value: failed contextual function claim
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: Case-local label for the canonical Chapter-40 N3 countercase; no new claim type is created.
  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
    reference_object_boundary: Only composite.c17-linear-01 from C17-LINEAR-01 and synthetic renewal-review scene R1.
    operation_occurrence_boundary: Only PROJECT_AS occurrence project-as.c40-n3.01.
    frame:
      value: synthetic renewal-review registry frame R1
      control_source: 03_cases/yaml/C40-N3_PROJECT_AS_Label_Substitution_Failure.yaml#/target/frame
      inventory_status: extension
      extension_rationale: Case-local target frame used only to test template-label substitution.
    granularity:
      value: single template-label assignment granularity
      control_source: 03_cases/yaml/C40-N3_PROJECT_AS_Label_Substitution_Failure.yaml#/target/granularity
      inventory_status: extension
      extension_rationale: Case-local target granularity for one nominal registry assignment.
    relative_level:
      value: attempted contextual target-function level relative to the origin-typed Path
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Case-local source-target relation preserving the failed route.
    temporal_scope: Source Path t0–t3; attempted target-function assignment at t4 only.
    source_scope: Exactly the C17-LINEAR-01 Path plus the declared R1 registry rule that labels every authorization-bearing
      Path as an eligibility gate.
    context_scope: Only synthetic scene R1 and its review-template registry.
    generalization_boundary: No contextual function, analogy, semantic transfer, real registry behavior, or domain claim
      is retained beyond this case.
    excluded_reach:
    - No replacement of the origin type Path by the target label.
    - No claim that a nominal template assignment establishes a function, mechanism, capability, PMS primitive, or role.
    - No claim that bounded context compensates for absent PraxisPurchase, TraceableLoad, functional continuity, or Counterfactual
      Sensitivity.
    - No person, organization, legal status, eligibility decision, or real system is evaluated.
  validity_scope: The failed-operation assessment is valid only for the declared synthetic registry rule in scene R1
    at t4.
  claim_ceiling:
    asserted_relation: The R1 registry assigns the string eligibility-gate function to composite.c17-linear-01 because
      the source Path contains an authorization transition.
    reach: The prior Path, scene R1, one nominal assignment rule, and t4 only.
    precision: Source identity, origin type, assigned label, registry criterion, and absence of source-dependent functional
      criteria.
    generality: One synthetic source Path and one target template registry.
    functional_scope: No contextual function is retained; only the fact of template-label assignment and the failed PROJECT_AS
      claim are recorded.
    dependence_strength: The assignment is unchanged when the source Path's constitutive order, continuation relations,
      or non-label features are materially altered while the authorization token remains.
    inferential_distance: One attempted PROJECT_AS step that fails because nominal registry membership is substituted
      for contextual function.
    limiting_sources:
    - source.record.c17-linear-01
    - source.case.c40-n3.review-scene-r1
    rationale: The packet supports the Path identity and the nominal registry label, but not a source-sensitive target
      function.
  authority_boundary: The record authorizes only rejection of this synthetic PROJECT_AS claim; it grants no empirical
    truth, eligibility decision, role assignment, access decision, or application authority.
