      lock-in relation changes later transition accessibility and persistence.
    reach: R3, target field C3, transition-access dimensions, declared roles, and C3-R0–R4 only.
    precision: Three source identities, comparison coordinates, four constitutive recurrent positions, target uptake conditions,
      C3/E3 contrast, and defeat conditions only.
    generality: One synthetic recurrent-form source object and one synthetic later transition field.
