    temporal_scope: Three bounded prior source histories and one synthetic target follow-on window C3-R0–R4.
    source_scope: Only the three prior C17 Trajectory Records, their declared recurrent positions, comparison coordinates,
      inherited uncertainty/Loss, and the bounded C3/E3 fixture.
    context_scope: Only transition access, friction, expectation, role recurrence, resource commitment, and reopening cost
      in C3.
    generalization_boundary: No transfer to E3, other paths, institutions, periods, persons, groups, or real historical settings.
