      path W2.
    operation_occurrence_boundary: Only PROJECT_AS occurrence project-as.c40-p2.01.
    frame:
      value: synthetic wider institutional path frame W2
      control_source: 03_cases/yaml/C40-P2_Trajectory_as_Macro_Event.yaml#/target/frame
      inventory_status: extension
      extension_rationale: Case-local wider target frame only.
    granularity:
      value: one extended Macro-Event unit within a wider path reconstruction
      control_source: 03_cases/yaml/C40-P2_Trajectory_as_Macro_Event.yaml#/target/granularity
      inventory_status: extension
      extension_rationale: Case-local target granularity preserving source duration beneath one wider-path unit.
    relative_level:
      value: Macro-Event target-function level relative to the origin-typed Trajectory
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Instantiates the controlled source-target relative-level relation.
    temporal_scope: Source trajectory Q0–Q5; wider target path Q-1–Q8.
    source_scope: Exactly the baseline, central missed Q1 review, positive sub-events, persistent workaround, asymmetric load
      shift, default stabilization, partial Q5 repair, and retained uncertainty recorded in C17-LAMBDA-01.
    context_scope: Only the declared transition from review-correctable coordination to redesign-dependent coordination in
      wider path W2.
    generalization_boundary: No transfer to other paths, periods, institutions, trajectories, or real historical settings.
    excluded_reach:
    - No claim that the source Trajectory becomes an Event type, Macro-Event primitive, or PMS operator.
    - No claim that Q1, Q4, Q5, or any other punctual date is the complete event.
    - No claim that the source is the sole cause, necessary turning point, or explanatory monopoly for later redesign.
    - No transfer to comparison path Z2, in which timely review, full reset, and a later independent rule change carry the
      reconstruction without an additional Macro-Event function.
    - No person typing, legitimacy judgment, sanction, recommendation, or application authority.
  validity_scope: Valid only for the declared wider path W2, transition dimension, and Q-1–Q8 target period.
  claim_ceiling:
    asserted_relation: The retained Q0–Q5 phase sequence functions as one extended transition-bearing unit in W2 because its
      unresolved and partially repaired internal relations materially change later branching between ordinary review and formal
      redesign.
    reach: composite.c17-lambda-01, wider path W2, transition dimension review-correctable to redesign-dependent coordination,
      Q-1–Q8 only.
    precision: Internal phase order, retained duration, later branching difference, defeat conditions, and bounded target
      function only.
    generality: One synthetic source Trajectory and one wider synthetic target path.
    functional_scope: Bounded Macro-Event function for one wider-path segmentation and transition relation; no Event-type
      replacement, punctualization, or causal turning-point proof.
    dependence_strength: The function weakens or disappears if the Q1 review is completed with redistribution, the Q2–Q4 workaround/default
      relation does not stabilize, Q5 produces a full reset, or W2 is replaced by comparison path Z2.
    inferential_distance: One explicit PROJECT_AS occurrence from an independently typed Trajectory to one bounded non-operator
      target function.
    limiting_sources: &id001
    - source.record.c17-lambda-01
    - source.fixture.c40-p2.wider-path-w2
    rationale: The packet supports one extended transition-bearing unit in W2, but not a complete historical period, a punctual
      Event identity, causal necessity, cross-path transfer, or authority claim.
  authority_boundary: The case authorizes only the bounded methodological routing of this synthetic projection claim; it grants
    no empirical truth, causal proof, person judgment, institutional decision, policy, sanction, or application authority.
