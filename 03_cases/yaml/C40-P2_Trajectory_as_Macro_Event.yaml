claim:
  claim_id: claim.c40-p2.macro-event.01
  statement: Within synthetic wider institutional path W2 from Q-1 through Q8, the independently reconstructed Q0–Q5 workload-review
    Trajectory from C17-LAMBDA-01 performs one bounded Macro-Event function for the transition from ordinary review-correctable
    coordination to redesign-dependent coordination, because its internal sequence of missed review, workaround persistence,
    asymmetric load shift, default stabilization, and partial repair materially conditions later branching; the source remains
    a temporally extended Trajectory and is not punctualized into one Event or inflated into a causal turning-point proof.
  claim_type:
    value: bounded trajectory-to-macro-event claim
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: Case-local label for the canonical Chapter-32 PROJECT_AS family; no new claim type is created.
  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
