claim:
  claim_id: claim.c40-p1.frame-function.01
  statement: Within synthetic later coordination context C1 during Q6–Q7, the independently reconstructed workload-review
    trajectory from C17-LAMBDA-01 performs a bounded historical frame-function for the declared overloaded-role relation by
    structuring credible reopening interpretations, expected repair costs, and practically available coordination moves, while
    remaining a Trajectory and not becoming a Frame operator type.
  claim_type:
    value: bounded trajectory-to-frame-function claim
    control_source: 04_reference/Claim_Type_Table.md#42-transformation-claims
    inventory_status: extension
    extension_rationale: Case-local label for the canonical Chapter-31 PROJECT_AS family; no new claim type is created.
  claim_role:
    value: primary transformation claim
    control_source: 04_reference/Claim_Type_Table.md#32-claim-family-claim-type-and-claim-role
    inventory_status: current_controlled
  claim_scope:
