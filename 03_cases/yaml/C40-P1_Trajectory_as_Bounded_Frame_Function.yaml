      context C1.
    operation_occurrence_boundary: Only PROJECT_AS occurrence project-as.c40-p1.01.
    frame:
      value: synthetic later coordination frame C1
      control_source: 03_cases/yaml/C40-P1_Trajectory_as_Bounded_Frame_Function.yaml#/target/frame
      inventory_status: extension
      extension_rationale: Case-local target frame only.
    granularity:
      value: role-specific follow-on coordination granularity
      control_source: 03_cases/yaml/C40-P1_Trajectory_as_Bounded_Frame_Function.yaml#/target/granularity
      inventory_status: extension
      extension_rationale: Case-local target granularity for one role relation and one follow-on interval.
    relative_level:
      value: contextual frame-function level relative to the origin-typed Trajectory
      control_source: 04_reference/Glossary.md#relative-level
      inventory_status: extension
      extension_rationale: Instantiates the controlled source-target relative-level relation.
    temporal_scope: Source trajectory Q0–Q5; target-function interval Q6–Q7.
    source_scope: Exactly the central missed review, persistent workaround, asymmetric load shift, default stabilization,
      partial repair, and retained uncertainty recorded in C17-LAMBDA-01.
    context_scope: Only the declared overloaded-role relation in later coordination context C1 during Q6–Q7.
    generalization_boundary: No transfer to other roles, periods, organizations, trajectories, or real coordination settings.
    excluded_reach:
    - No claim that the source Trajectory becomes a Frame operator type or a new PMS primitive.
    - No claim that history determines later action, exhausts present conditions, or proves causality.
    - No projection to the comparison context Z, where a full role reset and new repair rule carry the target reconstruction
      without additional historical framing.
    - No person typing, legitimacy judgment, sanction, recommendation, or application authority.
  validity_scope: Valid only for the declared overloaded-role relation in synthetic context C1 during Q6–Q7.
  claim_ceiling:
    asserted_relation: Load-bearing features of the retained Q0–Q5 Trajectory materially structure which reopening interpretations,
      repair expectations, and coordination moves are practically credible for one declared role relation in C1.
    reach: composite.c17-lambda-01, target context C1, overloaded-role relation R_over, and Q6–Q7 only.
    precision: Historical load carriers, target-side praxis difference, defeat conditions, and bounded contextual function
      only.
    generality: One synthetic source trajectory, one target context, one role relation, and one follow-on interval.
    functional_scope: Bounded historical frame-function for interpretation, expectation, and repair-cost navigation; no origin-type
      replacement or global frame identity.
    dependence_strength: The function weakens or disappears if the missed review is timely repaired, the residual workload
      binding is released, or the target context is replaced by the reset context Z.
    inferential_distance: One explicit PROJECT_AS occurrence from an independently typed Trajectory to one bounded contextual
      function.
    limiting_sources:
    - source.record.c17-lambda-01
    - source.fixture.c40-p1.target-c1
    rationale: The packet supports a role- and interval-bounded frame-function, but not all-role, permanent, causal-monopoly,
      deterministic, cross-context, or authority claims.
  authority_boundary: The case authorizes only the bounded methodological routing of this synthetic projection claim; it grants
    no empirical truth, person judgment, coordination decision, policy, sanction, or application authority.
